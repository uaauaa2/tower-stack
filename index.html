// ============================================================
// CONFIG
// ============================================================
const CFG = {
  // Block (SQUARE)
  blockSize: 90,

  // Swing — constant speed
  swingSpeed: Math.PI,
  // Amplitude ramps with tower height (gentler progression)
  maxAngleStart: Math.PI * 5 / 180,   // 5° at start
  maxAngleMax: Math.PI * 20 / 180,     // 20° max — configurable via settings

  // Cable — fixed length = 4 × blockSize
  cableLength: 90 * 4, // 360px

  // Physics
  gravity: 2000,

  // Falling block rotation physics
  fallRestoringSpring: 12, // torque pulling block upright
  fallAngularDamping: 4,   // air resistance on rotation

  // Miss threshold: < 30% overlap = miss
  missOverlapRatio: 0.3,

  // Lives
  maxLives: 3,

  // Perfect tolerance (px)
  perfectTolerance: 3,

  // Camera: show 3.5 blocks of tower at bottom
  towerViewportRatio: 0.4, // ratio of screen for tower area (adjusted dynamically)
  visibleBlocks: 3.5,
  cameraLerp: 4.0,

  // Wobble — amplitude based on cumulative inaccuracy + height
  wobbleHeightFactor: 0.02,
  wobbleSpringK: 5,
  wobbleDamping: 1.5,
  wobbleReducePerfection: 0.5,
  wobbleReduceGood: 0.15,

  // Cable elasticity (stretch) — visible but slow
  cableStretchFactor: 0.04, // 4% max stretch
  cableStretchDamping: 12.0, // heavy damping for slow, smooth motion
  cableStiffness: 6, // very soft spring → slow, visible stretch

  // Colors
  blockColors: ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC','#FFA07A'],
  craneColor: '#546E7A',
  cableColor: '#37474F',
  hookColor: '#FFD93D',

  // Background zones — 8 zones, 10 floors each, smooth gradient transitions
  bgZones: [
    { maxFloor: 10,  skyTop: '#87CEEB', skyBot: '#D4F1F9', label: 'ground',   elements: ['tree','cloud','bird'] },
    { maxFloor: 20,  skyTop: '#6BB3D9', skyBot: '#B0DAE8', label: 'lowSky',    elements: ['cloud','bird'] },
    { maxFloor: 30,  skyTop: '#B8C6D4', skyBot: '#D8E2EA', label: 'cloudLayer', elements: ['cloud'] },
    { maxFloor: 40,  skyTop: '#3A8FBF', skyBot: '#7CC0E0', label: 'aboveClouds', elements: ['cloud','plane'] },
    { maxFloor: 50,  skyTop: '#1B4F72', skyBot: '#5499C7', label: 'strato',    elements: ['plane'] },
    { maxFloor: 60,  skyTop: '#4A235A', skyBot: '#7D3C98', label: 'meso',      elements: ['star','satellite'] },
    { maxFloor: 70,  skyTop: '#1B0A2E', skyBot: '#3C1F5E', label: 'thermo',    elements: ['star','satellite'] },
    { maxFloor: Infinity, skyTop: '#050510', skyBot: '#0A0A20', label: 'space', elements: ['star','satellite'] },
  ],

  // Scoring
  baseScore: 100,
  perfectBonus: 50,
  milestoneEvery: 10,
  milestoneBonus: 500,

};

// ============================================================
// UTILS
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function shadeColor(hex, pct) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = clamp(Math.round(r * (1 + pct/100)), 0, 255);
  g = clamp(Math.round(g * (1 + pct/100)), 0, 255);
  b = clamp(Math.round(b * (1 + pct/100)), 0, 255);
  return `rgb(${r},${g},${b})`;
}

function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(lerp(r1,r2,t)), g = Math.round(lerp(g1,g2,t)), b = Math.round(lerp(b1,b2,t));
  return `rgb(${r},${g},${b})`;
}

// ============================================================
// STORAGE
// ============================================================
const Storage = {
  _defaults: { highScore: 0, totalTowers: 0, highestTower: 0, towers: [] },
  load() {
    try {
      const raw = localStorage.getItem(CFG.storageKey);
      if (!raw) return { ...this._defaults, towers: [] };
      return JSON.parse(raw);
    } catch { return { ...this._defaults, towers: [] }; }
  },
  save(data) {
    try { localStorage.setItem(CFG.storageKey, JSON.stringify(data)); } catch {}
  },
  addTower(height, score) {
    const data = this.load();
    data.towers.push({ height, score, date: new Date().toISOString().slice(0,10) });
    if (data.towers.length > 50) data.towers = data.towers.slice(-50);
    data.totalTowers = data.towers.length;
    if (height > data.highestTower) data.highestTower = height;
    if (score > data.highScore) data.highScore = score;
    this.save(data);
    return data;
  },
  saveTheme(themeId) {
    const data = this.load();
    data.theme = themeId;
    this.save(data);
  }
};

// ============================================================
// PARTICLES
// ============================================================
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 80;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.life = 0.4 + Math.random() * 0.4;
    this.maxLife = this.life;
    this.size = 3 + Math.random() * 5;
    this.color = color;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vy += 200 * dt; this.life -= dt;
  }
  draw(ctx) {
    const alpha = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
let BS = CFG.blockSize; // updated in applySettings & resize

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = Math.min(window.innerWidth, 480);
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Scale block size relative to screen width
  // Design baseline: 90px block on 375px-wide phone (~24% of width)
  BS = Math.max(40, Math.round(W * 0.24));
  CFG.blockSize = BS;
  CFG.cableLength = BS * 4;
  CFG.perfectTolerance = Math.max(2, Math.round(BS * 0.033));
}
window.addEventListener('resize', resize);
resize();

// GAME STATE
// ============================================================
const STATES = { MENU: 0, PLAYING: 1, DROPPING: 2, GAME_OVER: 3, CITY_VIEW: 4, SETTINGS: 5, LEADERBOARD: 6, STATS: 7 };

// ============================================================

const TelegramWebApp = window.Telegram?.WebApp || null;
console.log('[TG] SDK loaded:', !!window.Telegram, 'WebApp:', !!TelegramWebApp, 'initData:', !!TelegramWebApp?.initData, 'user:', TelegramWebApp?.initDataUnsafe?.user);

// ============================================================
// API MODULE
// ============================================================
const API = {
  baseUrl: '', // set below
  _submitting: false,

  init() {

  },

  },

  getUser() {

  haptic(style) {

  async submitScore(gameData) {

API.init();
// Warm up backend after API is initialized
fetch(API.baseUrl + '/api/health').then(r => r.json()).then(d => console.log('[API] Warmup:', d)).catch(e => console.log('[API] Warmup failed:', e.message));
let state = STATES.MENU;
let score = 0, combo = 0, bestCombo = 0, totalPerfects = 0, gameStartTime = 0;
let lives = CFG.maxLives;
let tower = []; // [{x, y, color, perfect}]
let fallingBlock = null;
let debris = [];
let particles = [];
let floatTexts = [];
let crane = { pivotX: 0, pivotY: 0, time: 0, stretch: 0, stretchVel: 0 };
let camera = { y: 0, targetY: 0 };
let shake = { x: 0, y: 0, timer: 0, intensity: 0 };
let wobble = { angle: 0, angularVel: 0 };
let inputLocked = false;
let lastTime = 0;
let menuAnim = 0;
let gameOverTimer = 0;
let leaderboardData = null;
let leaderboardTab = 'all';
let statsData = null;
let hintOpacity = 1;
let cityScrollX = 0;
let cityTouchLastX = 0;
let cityDragging = false;
let buttons = [];

// BS is declared above with canvas setup

// ============================================================
// HELPERS
// ============================================================
function currentMaxAngle() {
  // Smooth interpolation: 10% of maxAngle at floor 0, 100% at floor 80+
  const floors = floorCount();
  const maxDeg = CFG.maxAngleMax * 180 / Math.PI;
  const startDeg = CFG.maxAngleStart * 180 / Math.PI;

  // Normalized progress: 0 at floor 0, 1 at floor 80+
  const t = clamp(floors / 80, 0, 1);
  // Smoothstep
  const st = t * t * (3 - 2 * t);
  // Interpolate from startDeg to maxDeg
  const angleDeg = lerp(startDeg, maxDeg, st);
  return Math.PI * angleDeg / 180;
}
function blockColor(i) { const c = theme().blockColors; return c[i % c.length]; }
function getTowerTop() { return tower.length > 0 ? tower[tower.length - 1] : null; }
function floorCount() { return Math.max(0, tower.length - 1); }

// Get background zone for current height
function getBgZone(floors) {
  for (const z of CFG.bgZones) {
    if (floors < z.maxFloor) return z;
  }
  return CFG.bgZones[CFG.bgZones.length - 1];
}
function getBgZoneIndex(floors) {
  for (let i = 0; i < CFG.bgZones.length; i++) {
    if (floors < CFG.bgZones[i].maxFloor) return i;
  }
  return CFG.bgZones.length - 1;
}

// ============================================================
// GAME FUNCTIONS
// ============================================================
function startGame() {
  state = STATES.PLAYING;
  score = 0; combo = 0; bestCombo = 0; totalPerfects = 0;
  gameStartTime = performance.now();
  lives = CFG.maxLives;
  tower = []; debris = []; particles = []; floatTexts = [];
  fallingBlock = null;
  crane.time = 0;
  crane.stretch = 0;
  crane.stretchVel = 0;
  wobble = { angle: 0, angularVel: 0, targetAngle: 0 };
  camera = { y: 0, targetY: 0 };
  shake = { x: 0, y: 0, timer: 0, intensity: 0 };
  hintOpacity = 1;
  gameOverTimer = 0;

  // Base block
  tower.push({
    x: W / 2 - BS / 2,
    y: 0, // world y, we'll set camera so this is visible
    color: '#78909C',
    perfect: false,
    isBase: true,
    offset: 0 // cumulative inaccuracy per block
  });

  // Set camera so base block is at bottom of visible area, with visibleBlocks blocks showing
  camera.targetY = tower[0].y - (H - BS - 20);
  camera.y = camera.targetY;

  spawnCrane();
}

function spawnCrane() {
  const top = getTowerTop();
  // Cable length is FIXED = 4 × blockSize
  // Block hangs at: pivotY + cableLength (below pivot)
  // Crane pivot can be above the visible screen — that's OK

  const cableLen = CFG.cableLength; // 360px

  // Gap between block bottom and tower top = BS (one block height)
  // block bottom = hookY + BS (hookY is top of block)
  // So hookY = top.y - BS - BS = top.y - 2*BS
  const desiredHookY = top.y - 2 * BS;
  const pivotY = desiredHookY - cableLen;

  crane.pivotX = W / 2;
  crane.pivotY = pivotY;
  crane.cableLength = cableLen;
  crane.time = 0;
  crane.stretch = 0;
  crane.stretchVel = 0;
}

function getSwingState() {
  const speed = CFG.swingSpeed; // constant
  const maxA = currentMaxAngle();
  const angle = maxA * Math.sin(crane.time * speed);
  const angularVel = maxA * speed * Math.cos(crane.time * speed);

  // Cable length with stretch
  const stretch = crane.stretch || 0;
  const cl = (crane.cableLength || 140) + stretch;
  const hookX = crane.pivotX + Math.sin(angle) * cl;
  const hookY = crane.pivotY + Math.cos(angle) * cl;

  // Block position: hook is the attachment point at top-center of block
  const blockX = hookX - BS / 2;
  const blockY = hookY;

  // Horizontal velocity (px/s) of the block
  const vx = angularVel * cl;

  return { angle, blockX, blockY, vx, speed, maxA, cl };
}

function dropBlock() {
  if (state !== STATES.PLAYING) return;
  API.haptic('medium');
  const { angle, vx, cl } = getSwingState();

  // Hook position (attachment point)
  const hookX = crane.pivotX + Math.sin(angle) * cl;
  const hookY = crane.pivotY + Math.cos(angle) * cl;

  // Block center when rotated around hook by -angle:
  //   In local coords (relative to hook), center = (0, BS/2)
  //   After rotation R(-angle): (BS/2·sin(angle), BS/2·cos(angle))
  //   World: hook + rotated offset
  const blockCenterX = hookX + (BS / 2) * Math.sin(angle);
  const blockCenterY = hookY + (BS / 2) * Math.cos(angle);

  // Small spin inherited from swing deceleration
  const angularVelFromSwing = -vx / cl * 0.3;

  fallingBlock = {
    x: blockCenterX - BS / 2,
    y: blockCenterY - BS / 2,
    width: BS, height: BS,
    color: blockColor(tower.length),
    vx: vx,
    vy: 0,
    rotation: -angle,
    angularVel: angularVelFromSwing,
  };
  state = STATES.DROPPING;
  hintOpacity = 0;
}

function getWobblePivot() {
  // Same pivot used for visual wobble rotation (drawTower)
  if (tower.length === 0) return null;
  const base = tower[0];
  return { x: base.x + BS / 2, y: base.y + BS }; // base center bottom
}

function landBlock() {
  const fb = fallingBlock;
  const top = getTowerTop();
  if (!top) { missBlock(null); return; }

  // Calculate overlap in world coordinates.
  // Both the falling block and the tower top share the same raw (world)
  // X coordinate, so overlap is simply compared in world space.
  // The visual rendering applies the same wobble transform to both
  // (drawTower + drawFallingBlock), so what the player sees matches
  // the physics result.
  const oL = Math.max(fb.x, top.x);
  const oR = Math.min(fb.x + BS, top.x + BS);
  const overlapW = oR - oL;
  const overlapRatio = overlapW / BS;

  if (overlapW <= 0) {
    // Complete miss
    missBlock(fb, 0);
    return;
  }

  // Check if overlap < 30% = miss
  if (overlapRatio < CFG.missOverlapRatio) {
    missBlock(fb, overlapW);
    return;
  }

  // Block lands — place it (full size, NO cutting)
  // Position: aligned to where it actually landed
  const placed = {
    x: fb.x, // full block, positioned where it fell
    y: top.y - BS,
    color: fb.color,
    perfect: false,
    offset: 0 // will be set below
  };

  // Check perfect (centered within tolerance)
  const centerOffset = Math.abs((fb.x + BS/2) - (top.x + BS/2));
  const isPerfect = centerOffset <= CFG.perfectTolerance;

  // Store offset for this block
  placed.offset = centerOffset;

  if (isPerfect) {
    // Snap to perfect position
    placed.x = top.x;
    placed.perfect = true;
    placed.offset = 0;
  }

  // Calculate wobble amplitude from cumulative inaccuracy + height
  const cumulativeOffset = tower.reduce((sum, b) => sum + b.offset, 0);
  const avgOffset = cumulativeOffset / tower.length;
  const heightScale = 1 + tower.length * CFG.wobbleHeightFactor;
  // Target angle: based on average inaccuracy scaled by height
  const targetWobbleAngle = (avgOffset / BS) * heightScale * 0.3;

  tower.push(placed);

  // Scoring
  if (isPerfect) {
    API.haptic('heavy');
    combo++;
    totalPerfects++;
    if (combo > bestCombo) bestCombo = combo;
    const multiplier = combo; // after increment, combo IS the multiplier
    const earned = (CFG.baseScore + CFG.perfectBonus) * multiplier;
    score += earned;

    floatTexts.push({
      text: combo > 1 ? `PERFECT ×${combo}!` : 'PERFECT!',
      x: placed.x + BS/2, y: placed.y - 10,
      vy: -70, life: 1.0, maxLife: 1.0, color: '#FFD700', size: 20
    });
    for (let i = 0; i < 10; i++) {
      particles.push(new Particle(placed.x + BS/2, placed.y + BS/2, '#FFD700'));
    }
    triggerShake(3, 0.15);
  } else {
    // Off-center landing
    const multiplier = combo + 1;
    score += CFG.baseScore * multiplier;
    triggerShake(1, 0.08);
  }

  // Set wobble target angle based on cumulative inaccuracy
  // Amplitude is constant until next block lands
  wobble.targetAngle = targetWobbleAngle;
  // Give initial impulse toward target
  if (Math.abs(wobble.angularVel) < 0.1) {
    wobble.angularVel = targetWobbleAngle * 2;
  }

  // Score float (reuse earned from scoring block)
  const floatEarned = isPerfect ? (CFG.baseScore + CFG.perfectBonus) * combo : CFG.baseScore * (combo + 1);
  floatTexts.push({
    text: `+${floatEarned}`, x: placed.x + BS/2, y: placed.y + BS/2,
    vy: -40, life: 0.8, maxLife: 0.8, color: '#FFFFFF', size: 16
  });

  // Milestone
  if (floorCount() > 0 && floorCount() % CFG.milestoneEvery === 0) {
    score += CFG.milestoneBonus;
    floatTexts.push({
      text: `MILESTONE +${CFG.milestoneBonus}`, x: W/2, y: placed.y,
      vy: -50, life: 1.2, maxLife: 1.2, color: '#FFD700', size: 22
    });
  }

  // Update camera
  updateCameraTarget();

  fallingBlock = null;
  state = STATES.PLAYING;
  spawnCrane();
}

function missBlock(fb, overlapPx) {
  API.haptic('light');
  if (fb) {
    const curRot = fb.rotation || 0;
    const curVx = fb.vx || 0;
    const top = getTowerTop();

    if (overlapPx > 0 && top) {
      // Partial overlap (edge hit) — block slides off the tower side.
      // It hits the edge and bounces outward with an upward kick,
      // then falls down alongside the tower.
      const hitLeft = fb.x < top.x; // block is to the left of tower
      const dir = hitLeft ? -1 : 1;
      const pushSpeed = 100 + Math.random() * 60; // horizontal push off edge
      const bounceVy = -120 - Math.random() * 60; // upward bounce from impact

      debris.push({
        x: fb.x, y: fb.y, width: BS, height: BS,
        color: fb.color,
        vx: curVx * 0.3 + dir * pushSpeed, // dampen inherited vx, add push
        vy: (fb.vy || 0) * 0.2 + bounceVy,  // mostly bounce up
        rot: curRot,
        vr: dir * (2 + Math.random() * 3)
      });
    } else {
      // Complete miss — block flies past, inherits all physics
      const dir = fb.x + BS/2 < W/2 ? -1 : 1;
      const nudge = Math.abs(curVx) < 20 ? dir * 60 : 0;
      debris.push({
        x: fb.x, y: fb.y, width: BS, height: BS,
        color: fb.color,
        vx: curVx + nudge,
        vy: fb.vy || 0,
        rot: curRot,
        vr: (fb.angularVel || 0) + dir * (1.5 + Math.random() * 2)
      });
    }
  }

  lives--;
  combo = 0;
  triggerShake(5, 0.25);

  floatTexts.push({
    text: lives > 0 ? `MISS! ${lives} ❤️ left` : 'MISS!',
    x: W/2, y: H * 0.35,
    vy: -30, life: 1.0, maxLife: 1.0, color: '#FF4444', size: 24
  });

  if (lives <= 0) {
    gameOver();
    return;
  }

  fallingBlock = null;
  state = STATES.PLAYING;
  spawnCrane();
}

function gameOver() {
  state = STATES.GAME_OVER;
  fallingBlock = null;
  gameOverTimer = 0;
  triggerShake(8, 0.4);
  API.hapticNotification('error');

  const height = floorCount();
  if (height > 0) {
    Storage.addTower(height, score);

    // Submit score to backend
    const tgData = API.getInitData();
    const tgUser = API.getUser();
    console.log('[GAME] gameOver:', {score, height, bestCombo, isTelegram: API.isTelegram(), hasInitData: !!tgData, user: tgUser});

    if (tgData) {
      const durationMs = Math.round(performance.now() - gameStartTime);
      
      // Debug: test auth validation
      fetch(API.baseUrl + '/api/debug-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: tgData }),
      }).then(r => r.json()).then(d => {
        window._debugAuth = d;
        console.log('[DEBUG-AUTH]', JSON.stringify(d, null, 2));
      }).catch(e => console.log('[DEBUG-AUTH] error:', e.message));
      
      API.submitScore({
        score, height, bestCombo, perfectCount: totalPerfects, durationMs,
      }).then(result => {
        if (result) {
          window._lastApiResult = result;
          console.log('[API] Score submitted:', result);
        } else {
          console.log('[API] submitScore returned null');
        }
      }).catch(err => {
        window._lastApiError = err.name === 'AbortError' ? 'timeout' : err.message;
        console.log('[API] submitScore error:', err);
      });
    } else {
      console.log('[API] No initData — playing locally');
    }
  }
}

function updateCameraTarget() {
  // Keep last 5-6 blocks in bottom 40% of screen
  const top = getTowerTop();
  if (!top) return;

  // We want the tower top to be at a screen position that shows visibleBlocks blocks below it
  // visibleBlocks * BS of tower content should fit in the tower viewport area
  // towerViewportBottom = H, towerViewportTop = H - visibleBlocks * BS
  // Tower top screen Y should be at towerViewportTop
  // screenY = worldY - camera.y => camera.y = worldY - towerViewportTop
  const towerViewportTop = H - CFG.visibleBlocks * BS;
  camera.targetY = top.y - towerViewportTop;
}

function triggerShake(intensity, duration) {
  shake.intensity = intensity;
  shake.timer = duration;
}

// ============================================================
// INPUT
// ============================================================
function handleAction() {
  if (inputLocked) return;
  inputLocked = true;
  setTimeout(() => inputLocked = false, 150);

  switch (state) {
    case STATES.MENU: startGame(); break;
    case STATES.PLAYING: dropBlock(); break;
    case STATES.GAME_OVER: startGame(); break;
  }
}

function handleButtonHit(mx, my) {
  for (const btn of buttons) {
    if (mx >= btn.cx - btn.w/2 && mx <= btn.cx + btn.w/2 &&
        my >= btn.cy - btn.h/2 && my <= btn.cy + btn.h/2) {
      btn.action();
      return true;
    }
  }
  return false;
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  if (state === STATES.CITY_VIEW) {
    cityTouchLastX = t.clientX;
    cityDragging = true;
    if (handleButtonHit(t.clientX, t.clientY)) return;
    return;
  }
  if (state === STATES.MENU || state === STATES.GAME_OVER || state === STATES.LEADERBOARD || state === STATES.STATS) {
    if (handleButtonHit(t.clientX, t.clientY)) return;
  }
  handleAction();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (state === STATES.CITY_VIEW && cityDragging) {
    const t = e.touches[0];
    cityScrollX -= (t.clientX - cityTouchLastX);
    cityTouchLastX = t.clientX;
    const su = Math.max(14, W * 0.065);
    const maxScroll = Math.max(0, (Storage.load().towers.length) * su * 2.8 - W + su * 3);
    cityScrollX = Math.max(0, Math.min(maxScroll, cityScrollX));
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { cityDragging = false; });

canvas.addEventListener('mousedown', (e) => {
  if (state === STATES.CITY_VIEW) {
    cityTouchLastX = e.clientX;
    cityDragging = true;
    if (handleButtonHit(e.clientX, e.clientY)) return;
    return;
  }
  if (state === STATES.MENU || state === STATES.GAME_OVER || state === STATES.LEADERBOARD || state === STATES.STATS) {
    if (handleButtonHit(e.clientX, e.clientY)) return;
  }
  handleAction();
});

canvas.addEventListener('mousemove', (e) => {
  if (state === STATES.CITY_VIEW && cityDragging) {
    cityScrollX -= (e.clientX - cityTouchLastX);
    cityTouchLastX = e.clientX;
    const su = Math.max(14, W * 0.065);
    const maxScrollM = Math.max(0, (Storage.load().towers.length) * su * 2.8 - W + su * 3);
    cityScrollX = Math.max(0, Math.min(maxScrollM, cityScrollX));
  }
});

canvas.addEventListener('mouseup', () => { cityDragging = false; });

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === 'Enter') {
    e.preventDefault();
    handleAction();
  }
});

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  // Shake
  if (shake.timer > 0) {
    shake.timer -= dt;
    const t = Math.max(0, shake.timer);
    shake.x = (Math.random() - 0.5) * 2 * shake.intensity * (t / 0.4);
    shake.y = (Math.random() - 0.5) * 2 * shake.intensity * (t / 0.4);
  } else {
    shake.x = 0; shake.y = 0;
  }

  // Particles
  particles = particles.filter(p => { p.update(dt); return p.life > 0; });

  // Float texts
  floatTexts = floatTexts.filter(ft => {
    ft.y += ft.vy * dt;
    ft.life -= dt;
    return ft.life > 0;
  });

  // Debris
  debris = debris.filter(d => {
    d.vy += CFG.gravity * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.rot += d.vr * dt;
    return d.y < camera.y + H + 200;
  });

  // Wobble — oscillate around 0 with amplitude = targetAngle
  // targetAngle is set when a block lands and stays constant until next landing
  if (state === STATES.PLAYING || state === STATES.DROPPING) {
    // No wobble while base block is still visible on screen
    const baseScreenY = tower[0].y - camera.y;
    const baseVisible = baseScreenY > -BS && baseScreenY < H + BS;
    if (baseVisible && tower.length <= Math.ceil(CFG.visibleBlocks)) {
      wobble.angle = 0;
      wobble.angularVel = 0;
    } else {
      // Damped spring toward oscillation with target amplitude
      // spring: pull toward -angle (restoring) + drive toward targetAngle amplitude
      const springForce = -CFG.wobbleSpringK * wobble.angle;
      const dampForce = -CFG.wobbleDamping * wobble.angularVel;
      // Add energy to maintain target amplitude
      const currentAmplitude = Math.sqrt(wobble.angle * wobble.angle + (wobble.angularVel / CFG.wobbleSpringK) * (wobble.angularVel / CFG.wobbleSpringK));
      const energyForce = (wobble.targetAngle - currentAmplitude) * CFG.wobbleSpringK * 0.5 * Math.sign(wobble.angularVel);
      wobble.angularVel += (springForce + dampForce + energyForce) * dt;
      wobble.angle += wobble.angularVel * dt;
    }
  }

  // Crane swing
  if (state === STATES.PLAYING) {
    crane.time += dt;

    // Cable stretch physics — simulates elasticity
    // Centripetal force from pendulum causes stretch
    const speed = CFG.swingSpeed;
    const maxA = currentMaxAngle();
    const angle = maxA * Math.sin(crane.time * speed);
    const angAccel = -maxA * speed * speed * Math.sin(crane.time * speed);
    const baseLen = crane.cableLength || 140;
    // Centripetal + gravity component along cable
    const centripetal = baseLen * (maxA * speed) * (maxA * speed);
    // Simplified: stretch target based on swing dynamics
    const maxStretch = baseLen * CFG.cableStretchFactor;
    // Smooth stretch target: peaks at swing extremes, zero at center
    const sinVal = Math.sin(crane.time * speed);
    const stretchTarget = maxStretch * sinVal * sinVal;
    // Soft spring-damper for stretch — high damping prevents jerk
    const stretchSpring = (stretchTarget - crane.stretch) * CFG.cableStiffness;
    const stretchDamp = -crane.stretchVel * CFG.cableStretchDamping * CFG.cableStiffness;
    crane.stretchVel += (stretchSpring + stretchDamp) * dt;
    crane.stretch += crane.stretchVel * dt;
    // Clamp stretch
    crane.stretch = clamp(crane.stretch, -maxStretch * 0.2, maxStretch);
  }

  // Falling block with inertia + rotation physics
  if (state === STATES.DROPPING && fallingBlock) {
    fallingBlock.vy += CFG.gravity * dt;
    fallingBlock.x += fallingBlock.vx * dt; // horizontal inertia
    fallingBlock.y += fallingBlock.vy * dt;

    // Rotation physics:
    // 1) Restoring torque — block's center of mass pulls it toward upright
    //    (simulates gravity pulling the heavy bottom down)
    const restoringTorque = -fallingBlock.rotation * CFG.fallRestoringSpring;
    // 2) Air resistance damping on angular velocity
    const angularDamping = -fallingBlock.angularVel * CFG.fallAngularDamping;
    // Apply torques
    fallingBlock.angularVel += (restoringTorque + angularDamping) * dt;
    fallingBlock.rotation += fallingBlock.angularVel * dt;

    // Keep block on screen horizontally
    fallingBlock.x = clamp(fallingBlock.x, -BS, W);

    // Check collision with tower top
    const top = getTowerTop();
    if (top && fallingBlock.y + BS >= top.y) {
      landBlock();
    }

    // Fell way below
    if (fallingBlock && fallingBlock.y > camera.y + H + 200) {
      missBlock(fallingBlock, 0);
    }
  }

  // Camera smooth follow
  camera.y += (camera.targetY - camera.y) * CFG.cameraLerp * dt;

  // Game over timer
  if (state === STATES.GAME_OVER) gameOverTimer += dt;

  // Menu animation
  if (state === STATES.MENU) menuAnim += dt;
}

// ============================================================
// DRAW — Block Sprites (pre-rendered offscreen canvas, cached)
// ============================================================
const SPRITE_CACHE = {};

function getBlockSprite(themeId, color, isPerfect, size) {
  const key = `${themeId}_${color}_${isPerfect ? 1 : 0}_${size}`;
  if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const oc = document.createElement('canvas');
  oc.width = size; oc.height = size;
  const c = oc.getContext('2d');
  const style = (THEMES[themeId] || THEMES.classic).blockStyle;
  switch (style) {
    case 'cyberpunk': buildSpriteCyberpunk(c, color, isPerfect, size); break;
    case 'ascii':     buildSpriteAscii(c, color, isPerfect, size); break;
    case 'pixel':     buildSpritePixel(c, color, isPerfect, size); break;
    default:          buildSpriteClassic(c, color, isPerfect, size); break;
  }
  SPRITE_CACHE[key] = oc;
  return oc;
}

function drawBlockTheme(bx, by, color, isPerfect) {
  ctx.drawImage(getBlockSprite(activeTheme, color, isPerfect || false, BS), bx, by, BS, BS);
}

// ──────────────────────────────────────────────────────────────
// Sprite: CLASSIC — glossy painted block with bevel & shine
// ──────────────────────────────────────────────────────────────
function buildSpriteClassic(c, color, isPerfect, S) {
  // 5-stop vertical gradient for rich depth
  const g = c.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0,    shadeColor(color, 52));
  g.addColorStop(0.12, shadeColor(color, 26));
  g.addColorStop(0.5,  color);
  g.addColorStop(0.88, shadeColor(color, -22));
  g.addColorStop(1,    shadeColor(color, -45));
  c.fillStyle = g;
  c.fillRect(0, 0, S, S);

  // Horizontal light-to-dark gradient overlay (left bright, right dark)
  const gh = c.createLinearGradient(0, 0, S, 0);
  gh.addColorStop(0,   'rgba(255,255,255,0.20)');
  gh.addColorStop(0.4, 'rgba(255,255,255,0)');
  gh.addColorStop(0.8, 'rgba(0,0,0,0)');
  gh.addColorStop(1,   'rgba(0,0,0,0.18)');
  c.fillStyle = gh;
  c.fillRect(0, 0, S, S);

  // Top bevel — bright edge
  const bT = c.createLinearGradient(0, 0, 0, S * 0.11);
  bT.addColorStop(0, 'rgba(255,255,255,0.70)');
  bT.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = bT;
  c.fillRect(0, 0, S, Math.ceil(S * 0.11));

  // Bottom bevel — dark edge
  const bB = c.createLinearGradient(0, S - S * 0.09, 0, S);
  bB.addColorStop(0, 'rgba(0,0,0,0)');
  bB.addColorStop(1, 'rgba(0,0,0,0.42)');
  c.fillStyle = bB;
  c.fillRect(0, Math.floor(S * 0.91), S, Math.ceil(S * 0.09));

  // Left bevel — thin bright strip
  const bL = c.createLinearGradient(0, 0, Math.ceil(S * 0.06), 0);
  bL.addColorStop(0, 'rgba(255,255,255,0.48)');
  bL.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = bL;
  c.fillRect(0, 0, Math.ceil(S * 0.06), S);

  // Right bevel — thin dark strip
  const bR = c.createLinearGradient(S - Math.ceil(S * 0.05), 0, S, 0);
  bR.addColorStop(0, 'rgba(0,0,0,0)');
  bR.addColorStop(1, 'rgba(0,0,0,0.22)');
  c.fillStyle = bR;
  c.fillRect(Math.floor(S * 0.95), 0, Math.ceil(S * 0.05), S);

  // Top-left corner shine — radial glow
  const shine = c.createRadialGradient(S * 0.18, S * 0.14, 0, S * 0.18, S * 0.14, S * 0.42);
  shine.addColorStop(0,   'rgba(255,255,255,0.50)');
  shine.addColorStop(0.4, 'rgba(255,255,255,0.16)');
  shine.addColorStop(1,   'rgba(255,255,255,0)');
  c.fillStyle = shine;
  c.fillRect(0, 0, S * 0.65, S * 0.55);

  // Subtle inner stroke (depth illusion)
  c.strokeStyle = 'rgba(0,0,0,0.10)';
  c.lineWidth = 1;
  c.strokeRect(0.5, 0.5, S - 1, S - 1);

  if (isPerfect) {
    // Golden diagonal shimmer
    const pg = c.createLinearGradient(0, 0, S, S);
    pg.addColorStop(0,   'rgba(255,230,0,0.28)');
    pg.addColorStop(0.45,'rgba(255,200,0,0.06)');
    pg.addColorStop(1,   'rgba(255,160,0,0.28)');
    c.fillStyle = pg;
    c.fillRect(0, 0, S, S);
    // Gold inner border
    c.shadowColor = '#FFD700';
    c.shadowBlur = 6;
    c.strokeStyle = 'rgba(255,215,0,0.85)';
    c.lineWidth = 2;
    c.strokeRect(1.5, 1.5, S - 3, S - 3);
    c.shadowBlur = 0;
  }
}

// ──────────────────────────────────────────────────────────────
// Sprite: CYBERPUNK — circuit board with neon traces & glow
// ──────────────────────────────────────────────────────────────
function buildSpriteCyberpunk(c, color, isPerfect, S) {
  const lw = Math.max(1, Math.floor(S / 22)); // line/trace width

  // Base: near-black
  c.fillStyle = '#01000F';
  c.fillRect(0, 0, S, S);

  // Subtle color tint fill
  c.fillStyle = color + '14';
  c.fillRect(0, 0, S, S);

  // Horizontal scanlines
  c.fillStyle = 'rgba(0,0,0,0.30)';
  for (let y = 0; y < S; y += 3) c.fillRect(0, y, S, 1);

  // ── Circuit traces ──
  c.strokeStyle = color + '70';
  c.lineWidth = lw;
  c.lineJoin = 'miter';

  // Trace 1: L-shape from left edge → right, then up
  c.beginPath();
  c.moveTo(S * 0.08, S * 0.38);
  c.lineTo(S * 0.52, S * 0.38);
  c.lineTo(S * 0.52, S * 0.18);
  c.stroke();

  // Trace 2: from top → down, then right
  c.beginPath();
  c.moveTo(S * 0.72, S * 0.08);
  c.lineTo(S * 0.72, S * 0.62);
  c.lineTo(S * 0.57, S * 0.62);
  c.stroke();

  // Trace 3: short horizontal at bottom
  c.beginPath();
  c.moveTo(S * 0.14, S * 0.78);
  c.lineTo(S * 0.42, S * 0.78);
  c.stroke();

  // Node circles at trace intersections
  c.fillStyle = color + 'CC';
  [[S * 0.52, S * 0.38], [S * 0.72, S * 0.38], [S * 0.72, S * 0.62], [S * 0.42, S * 0.78]].forEach(([nx, ny]) => {
    c.beginPath();
    c.arc(nx, ny, lw * 2, 0, Math.PI * 2);
    c.fill();
  });

  // ── Corner bracket markers ──
  const bs = Math.floor(S * 0.19);
  c.fillStyle = isPerfect ? '#FFFFFF' : color;
  // Top-left
  c.fillRect(0,        0,        bs, lw);   c.fillRect(0,      0,      lw, bs);
  // Top-right
  c.fillRect(S - bs,   0,        bs, lw);   c.fillRect(S - lw, 0,      lw, bs);
  // Bottom-left
  c.fillRect(0,        S - lw,   bs, lw);   c.fillRect(0,      S - bs, lw, bs);
  // Bottom-right
  c.fillRect(S - bs,   S - lw,   bs, lw);   c.fillRect(S - lw, S - bs, lw, bs);

  // ── Neon border with glow ──
  const glowBlur = isPerfect ? 14 : 7;
  c.shadowColor = color;
  c.shadowBlur = glowBlur;
  c.strokeStyle = color;
  c.lineWidth = isPerfect ? 2 : 1.5;
  const inset = lw + 0.5;
  c.strokeRect(inset, inset, S - inset * 2, S - inset * 2);
  c.shadowBlur = 0;

  if (isPerfect) {
    // Second inner glow ring
    c.shadowColor = color;
    c.shadowBlur = 22;
    c.strokeStyle = color + 'AA';
    c.lineWidth = 1;
    c.strokeRect(lw * 3, lw * 3, S - lw * 6, S - lw * 6);
    c.shadowBlur = 0;
  }
}

// ──────────────────────────────────────────────────────────────
// Sprite: ASCII — terminal box with box-drawing chars & CRT glow
// ──────────────────────────────────────────────────────────────
function buildSpriteAscii(c, color, isPerfect, S) {
  const fSize  = Math.max(9, Math.floor(S / 6.5));
  const fW     = Math.ceil(fSize * 0.62); // approx monospace char width
  const bright = isPerfect ? '#88FF44' : color;

  // Base — dark terminal green
  c.fillStyle = isPerfect ? '#001f00' : '#001100';
  c.fillRect(0, 0, S, S);

  // CRT scanlines
  c.fillStyle = 'rgba(0,0,0,0.32)';
  for (let y = 0; y < S; y += 2) c.fillRect(0, y, S, 1);

  // ── Box drawing border ──
  c.font = `${fSize}px 'Courier New',Courier,monospace`;
  c.textBaseline = 'top';
  c.textAlign = 'left';
  c.fillStyle = bright;

  const numCols = Math.max(1, Math.floor((S - fW * 2) / fW));
  const numRows = Math.max(1, Math.floor((S - fSize * 2) / fSize));
  const dash = '═'.repeat(numCols);

  // Top & bottom border lines
  c.fillText('╔' + dash + '╗', 0, 0);
  c.fillText('╚' + dash + '╝', 0, S - fSize);

  // Left & right side bars
  for (let r = 0; r < numRows; r++) {
    const ry = fSize + r * fSize;
    if (ry >= S - fSize) break;
    c.fillText('║', 0, ry);
    c.fillText('║', S - fW, ry);
  }

  // ── Interior: '░' character fill ──
  const ifSize = Math.max(6, Math.floor(S / 9));
  const ifW    = Math.ceil(ifSize * 0.62);
  c.font = `${ifSize}px 'Courier New',Courier,monospace`;
  c.fillStyle = bright + (isPerfect ? '90' : '55');

  for (let ry = fSize + 2; ry < S - fSize - 2; ry += ifSize) {
    for (let rx = fW + 2; rx < S - fW - 2; rx += ifW) {
      c.fillText(isPerfect ? '▓' : '░', rx, ry);
    }
  }

  // ── Phosphor glow overlay ──
  const glow = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * 0.72);
  glow.addColorStop(0, 'rgba(0,200,0,0.06)');
  glow.addColorStop(1, 'rgba(0,60,0,0.14)');
  c.fillStyle = glow;
  c.fillRect(0, 0, S, S);

  if (isPerfect) {
    // Bright outer stroke
    c.shadowColor = bright;
    c.shadowBlur = 8;
    c.strokeStyle = bright;
    c.lineWidth = 1;
    c.strokeRect(0.5, 0.5, S - 1, S - 1);
    c.shadowBlur = 0;
  }
}

// ──────────────────────────────────────────────────────────────
// Sprite: PIXEL — NES-style hard-edge block with rivet detail
// ──────────────────────────────────────────────────────────────
function buildSpritePixel(c, color, isPerfect, S) {
  const P = Math.max(2, Math.floor(S / 10)); // pixel unit

  // Base fill
  c.fillStyle = color;
  c.fillRect(0, 0, S, S);

  // Inner panel (slightly lighter — creates depth illusion)
  c.fillStyle = shadeColor(color, 10);
  c.fillRect(P * 2, P * 2, S - P * 4, S - P * 4);

  // Dither pattern inside panel (every other pixel darker)
  c.fillStyle = shadeColor(color, -14);
  for (let r = P * 2; r < S - P * 2; r += P) {
    const offset = (Math.floor(r / P) % 2 === 0) ? 0 : P;
    for (let col = P * 2 + offset; col < S - P * 2; col += P * 2) {
      c.fillRect(col, r, P, P);
    }
  }

  // Top highlight strip (1-unit, bright)
  c.fillStyle = shadeColor(color, 58);
  c.fillRect(0, 0, S, P);
  c.fillRect(0, 0, P, S);

  // Second highlight strip (softer)
  c.fillStyle = shadeColor(color, 30);
  c.fillRect(P, P, S - P * 2, P);
  c.fillRect(P, P, P, S - P * 2);

  // Bottom shadow strip (darkest)
  c.fillStyle = shadeColor(color, -58);
  c.fillRect(0, S - P, S, P);
  c.fillRect(S - P, 0, P, S);

  // Second shadow strip (softer)
  c.fillStyle = shadeColor(color, -30);
  c.fillRect(P, S - P * 2, S - P * 2, P);
  c.fillRect(S - P * 2, P, P, S - P * 2);

  // Corner rivets — small squares inset from corners
  const rv = Math.ceil(P * 1.4);
  const rOff = P * 2;
  c.fillStyle = shadeColor(color, -68);
  c.fillRect(rOff, rOff, rv, rv);                       // TL
  c.fillRect(S - rOff - rv, rOff, rv, rv);              // TR
  c.fillRect(rOff, S - rOff - rv, rv, rv);              // BL
  c.fillRect(S - rOff - rv, S - rOff - rv, rv, rv);    // BR

  // Rivet highlight (top-left pixel of each rivet)
  const rh = Math.ceil(rv / 2);
  c.fillStyle = shadeColor(color, 32);
  c.fillRect(rOff, rOff, rh, rh);
  c.fillRect(S - rOff - rv, rOff, rh, rh);
  c.fillRect(rOff, S - rOff - rv, rh, rh);
  c.fillRect(S - rOff - rv, S - rOff - rv, rh, rh);

  // Hard 1px black outline (no anti-alias feel)
  c.strokeStyle = '#000000';
  c.lineWidth = 1;
  c.strokeRect(0.5, 0.5, S - 1, S - 1);

  // Perfect: gold inner border
  if (isPerfect) {
    c.strokeStyle = '#FFFF00';
    c.lineWidth = Math.max(1, P - 1);
    c.strokeRect(P - 0.5, P - 0.5, S - P * 2 + 1, S - P * 2 + 1);
  }
}

function initBgObjects() {
  bgObjects = [];
  for (const zd of BG_ZONE_DEFS) {
    for (const sp of zd.spawns) {
      for (let i = 0; i < sp.count; i++) {
        const floorOff = sp.floorMin + Math.random() * (sp.floorMax - sp.floorMin);
        // worldY: blocks go UP (negative Y), so floor N is at tower[0].y - N*BS
        // We place objects at that height, offset by a random spread within a few BS
        const spread = BS * (1 + Math.random() * 3);
        const size = sp.sizeRange[0] + Math.random() * (sp.sizeRange[1] - sp.sizeRange[0]);
        const speed = sp.speedRange[0] + Math.random() * (sp.speedRange[1] - sp.speedRange[0]);
        bgObjects.push({
          type: sp.type,
          x: Math.random() * 500,
          floorOffset: floorOff, // which floor this object lives at
          yOffset: (Math.random() - 0.3) * spread, // random vertical spread around the floor
          size,
          speed,
          phase: Math.random() * Math.PI * 2,
          zone: zd.zone,
          dir: Math.random() > 0.5 ? 1 : -1, // random horizontal direction
        });
      }
    }
  }
}
initBgObjects();

let matrixColumns = [];
function initMatrixRain() {
  const colW = 14;
  const numCols = Math.ceil(480 / colW);
  matrixColumns = [];
  const chars = '0123456789ABCDEF<>[]{}|/\\!@#$%^&*';
  for (let i = 0; i < numCols; i++) {
    const len = 5 + Math.floor(Math.random() * 15);
    const col = { x: i * colW + colW/2, y: Math.random() * 600, speed: 35 + Math.random() * 55, len, chars: [] };
    for (let j = 0; j < len + 2; j++) col.chars.push(chars[Math.floor(Math.random() * chars.length)]);
    matrixColumns.push(col);
  }
}
initMatrixRain();

// Load saved theme
{ const _d = Storage.load(); activeTheme = THEMES[_d.theme] ? _d.theme : 'classic'; }

function drawBackground() {
  switch (theme().bgStyle) {
    case 'cyberpunk': drawBackgroundCyberpunk(); break;
    case 'ascii':     drawBackgroundAscii(); break;
    case 'pixel':     drawBackgroundPixel(); break;
    default:          drawBackgroundClassic(); break;
  }
}

function drawBackgroundCyberpunk() {
  const floors = floorCount();
  const dark = Math.min(floors / 60, 1);
  const bg = `rgb(${Math.round(lerp(5,2,dark))},${Math.round(lerp(0,0,dark))},${Math.round(lerp(20,8,dark))})`;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // Grid
  ctx.strokeStyle = 'rgba(0,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
  // Neon horizon glow
  if (floors < 15) {
    const grd = ctx.createLinearGradient(0, H * 0.7, 0, H);
    grd.addColorStop(0, 'rgba(0,255,255,0)');
    grd.addColorStop(1, 'rgba(0,255,255,0.08)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);
  }
}

function drawBackgroundAscii() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  // Scanlines
  ctx.fillStyle = 'rgba(0,20,0,0.4)';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
  // Matrix rain
  const t = Date.now() / 1000;
  ctx.font = '13px Courier New,monospace';
  ctx.textAlign = 'center';
  for (const col of matrixColumns) {
    const baseY = ((col.y + t * col.speed) % (H + col.len * 14));
    for (let i = 0; i < col.len; i++) {
      const cy = baseY - i * 14;
      if (cy < -14 || cy > H + 14) continue;
      const brightness = 1 - i / col.len;
      const alpha = brightness * 0.7;
      const ci = (Math.floor(t * 6 + i * 2.3) % col.chars.length + col.chars.length) % col.chars.length;
      ctx.fillStyle = i === 0
        ? `rgba(180,255,180,${clamp(alpha + 0.3, 0, 1)})`
        : `rgba(0,${Math.round(120 + brightness * 80)},0,${clamp(alpha,0,1)})`;
      ctx.fillText(col.chars[ci], col.x, cy);
    }
  }
  ctx.textAlign = 'left';
}

function drawBackgroundPixel() {
  const floors = floorCount();
  const zones = [
    { maxFloor: 15, sky: '#5C94FC' },
    { maxFloor: 30, sky: '#3A6EC0' },
    { maxFloor: 50, sky: '#1A2A88' },
    { maxFloor: 70, sky: '#0A0A50' },
    { maxFloor: Infinity, sky: '#000010' },
  ];
  let sky = '#5C94FC';
  for (const z of zones) { if (floors < z.maxFloor) { sky = z.sky; break; } }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // Chunky pixel clouds (low altitude)
  if (floors < 25) {
    const t = Date.now() / 1000;
    ctx.fillStyle = '#FFFFFF';
    [30, 170, 310, 420].forEach((cx, i) => {
      const x = Math.floor(((cx + t * 10 + i * 50) % (W + 100)) - 50);
      const y = 40 + i * 28;
      ctx.fillRect(x, y, 40, 12);
      ctx.fillRect(x - 8, y + 4, 12, 8);
      ctx.fillRect(x + 36, y + 4, 12, 8);
      ctx.fillRect(x + 10, y - 8, 20, 8);
    });
  }
  // Pixel stars (high altitude)
  if (floors > 35) {
    const starData = [50,150,250,350,90,190,290,390,70,170,270,370];
    starData.forEach((sx, i) => {
      ctx.fillStyle = i % 3 === 0 ? '#FFFFFF' : '#FFFF88';
      ctx.fillRect(sx % W, (i * 43 + 20) % (H - 20), 4, 4);
    });
  }
}

function drawBackgroundClassic() {
  const floors = floorCount();
  const zi = getBgZoneIndex(floors);
  const zone = CFG.bgZones[zi];

  // Smooth gradient transition between zones
  // Blend with next zone when within last 30% of current zone
  let skyTop = zone.skyTop;
  let skyBot = zone.skyBot;
  const prevMax = zi > 0 ? CFG.bgZones[zi - 1].maxFloor : 0;
  const zoneSize = zone.maxFloor === Infinity ? 10 : (zone.maxFloor - prevMax);
  const progress = (floors - prevMax) / zoneSize; // 0..1 within this zone

  // Transition to next zone in last 30%
  if (progress > 0.7 && zi < CFG.bgZones.length - 1) {
    const nextZone = CFG.bgZones[zi + 1];
    const t = (progress - 0.7) / 0.3; // 0..1 over last 30%
    skyTop = lerpColor(zone.skyTop, nextZone.skyTop, t);
    skyBot = lerpColor(zone.skyBot, nextZone.skyBot, t);
  }
  // Transition from prev zone in first 30%
  if (progress < 0.3 && zi > 0) {
    const prevZone = CFG.bgZones[zi - 1];
    const t = progress / 0.3; // 0..1 over first 30%
    skyTop = lerpColor(prevZone.skyTop, zone.skyTop, t);
    skyBot = lerpColor(prevZone.skyBot, zone.skyBot, t);
  }

  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const t = Date.now() / 1000;

  // Draw bg objects — world-space positioned, visible when camera scrolls past them
  // Convert each object's floorOffset to a world Y, then to screen Y
  const baseY = tower.length > 0 ? tower[0].y : 0;
  for (const obj of bgObjects) {
    // Check if this object's zone is relevant
    if (obj.zone > zi + 1 || obj.zone < zi - 1) continue;

    // Compute world Y: objects live at floorOffset floors above ground
    // Each floor = BS pixels upward (negative Y direction)
    const objWorldY = baseY - obj.floorOffset * BS + obj.yOffset;
    const objScreenY = objWorldY - camera.y + shake.y;

    // Skip objects off-screen (with margin)
    const margin = 120;
    if (objScreenY < -margin || objScreenY > H + margin) continue;

    let alpha = 1;
    if (obj.zone !== zi) alpha = 0.3; // fade adjacent zone objects

    ctx.globalAlpha = alpha;

    switch (obj.type) {
      case 'tree': drawTree(obj, t, objScreenY); break;
      case 'cloud': drawCloudObj(obj, t, objScreenY); break;
      case 'bird': drawBird(obj, t, objScreenY); break;
      case 'helicopter': drawHelicopter(obj, t, objScreenY); break;
      case 'plane': drawPlane(obj, t, objScreenY); break;
      case 'star': drawStar(obj, t, objScreenY); break;
      case 'satellite': drawSatellite(obj, t, objScreenY); break;
      case 'kite': drawKite(obj, t, objScreenY); break;
      case 'balloon': drawBalloon(obj, t, objScreenY); break;
      case 'shootingStar': drawShootingStar(obj, t, objScreenY); break;
      case 'aurora': drawAurora(obj, t, objScreenY); break;
      case 'ufo': drawUFO(obj, t, objScreenY); break;
      case 'butterfly': drawButterfly(obj, t, objScreenY); break;
      case 'spaceStation': drawSpaceStation(obj, t, objScreenY); break;
    }

    ctx.globalAlpha = 1;
  }
}

function drawTree(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 60)) - 30;
  const y = screenY;
  const s = obj.size;
  // Trunk
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(x - s*0.1, y - s*1.5, s*0.2, s*1.5);
  // Canopy
  ctx.fillStyle = '#228B22';
  ctx.beginPath();
  ctx.moveTo(x, y - s*2.5);
  ctx.lineTo(x - s*0.6, y - s*1.2);
  ctx.lineTo(x + s*0.6, y - s*1.2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, y - s*3);
  ctx.lineTo(x - s*0.45, y - s*1.8);
  ctx.lineTo(x + s*0.45, y - s*1.8);
  ctx.fill();
}

function drawCloudObj(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 120)) - 60;
  const y = screenY + Math.sin(t * 0.3 + obj.phase) * 10;
  const s = obj.size;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(x, y, 20*s, 0, Math.PI*2);
  ctx.arc(x + 20*s, y - 5*s, 16*s, 0, Math.PI*2);
  ctx.arc(x - 15*s, y + 3*s, 14*s, 0, Math.PI*2);
  ctx.fill();
}

function drawBird(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 40)) - 20;
  const y = screenY + Math.sin(t * 2 + obj.phase) * 8;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  const wing = Math.sin(t * 8 + obj.phase) * 6;
  ctx.beginPath();
  ctx.moveTo(x - 8, y + wing);
  ctx.quadraticCurveTo(x - 3, y - 3, x, y);
  ctx.quadraticCurveTo(x + 3, y - 3, x + 8, y + wing);
  ctx.stroke();
}

function drawHelicopter(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 80)) - 40;
  const y = screenY + Math.sin(t * 0.5 + obj.phase) * 15;
  // Body
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.ellipse(x, y, 15, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Rotor
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  const rotor = Math.sin(t * 30 + obj.phase) > 0 ? 20 : 18;
  ctx.beginPath();
  ctx.moveTo(x - rotor, y - 7);
  ctx.lineTo(x + rotor, y - 7);
  ctx.stroke();
  // Tail
  ctx.fillStyle = '#666';
  ctx.fillRect(x + 14, y - 3, 12, 3);
}

function drawPlane(obj, t, screenY) {
  const dir = obj.dir;
  const x = ((obj.x + t * obj.speed * dir) % (W + 120)) - 60;
  const y = screenY + Math.sin(t * 0.3 + obj.phase) * 10;
  // Body
  ctx.fillStyle = '#E0E0E0';
  ctx.beginPath();
  ctx.ellipse(x, y, 20, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Wings
  ctx.fillStyle = '#CCC';
  ctx.beginPath();
  ctx.moveTo(x - 3, y);
  ctx.lineTo(x - 12, y - 12);
  ctx.lineTo(x + 12, y - 12);
  ctx.lineTo(x + 3, y);
  ctx.fill();
  // Tail
  ctx.beginPath();
  ctx.moveTo(x + 17, y);
  ctx.lineTo(x + 22, y - 7);
  ctx.lineTo(x + 22, y);
  ctx.fill();
  // Trail
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 25, y - 1);
  ctx.lineTo(x + 60, y - 3);
  ctx.moveTo(x + 25, y + 1);
  ctx.lineTo(x + 60, y + 3);
  ctx.stroke();
}

function drawStar(obj, t, screenY) {
  const x = obj.x;
  const y = screenY;
  const twinkle = 0.5 + 0.5 * Math.sin(t * 3 + obj.phase);
  ctx.globalAlpha = twinkle;
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.arc(x, y, obj.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSatellite(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 60)) - 30;
  const y = screenY + Math.sin(t * 0.2 + obj.phase) * 20;
  // Body
  ctx.fillStyle = '#B0B0B0';
  ctx.fillRect(x - 4, y - 3, 8, 6);
  // Solar panels
  ctx.fillStyle = '#4488CC';
  ctx.fillRect(x - 14, y - 2, 10, 4);
  ctx.fillRect(x + 4, y - 2, 10, 4);
  // Antenna
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y - 3);
  ctx.lineTo(x, y - 8);
  ctx.stroke();
  ctx.fillStyle = '#FF4444';
  ctx.beginPath();
  ctx.arc(x, y - 8, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawKite(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 60)) - 30;
  const y = screenY + Math.sin(t * 1.5 + obj.phase) * 20;
  const s = 12 * obj.size;
  // Kite body (diamond)
  const colors = ['#FF4444','#FFD700','#4D96FF','#6BCB77'];
  ctx.fillStyle = colors[Math.floor(obj.phase * 2) % colors.length];
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x + s * 0.6, y);
  ctx.lineTo(x, y + s * 0.4);
  ctx.lineTo(x - s * 0.6, y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Cross sticks
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x, y + s * 0.4); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - s * 0.6, y); ctx.lineTo(x + s * 0.6, y); ctx.stroke();
  // Tail
  ctx.strokeStyle = ctx.fillStyle;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.4);
  ctx.quadraticCurveTo(x + 8 + Math.sin(t * 3 + obj.phase) * 6, y + s * 0.4 + 15, x + 4, y + s * 0.4 + 30);
  ctx.stroke();
  // String to ground
  ctx.strokeStyle = 'rgba(150,150,150,0.4)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x + (Math.sin(t * 0.5) * 10), y - s - 80);
  ctx.stroke();
}

function drawBalloon(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 50)) - 25;
  const y = screenY + Math.sin(t * 0.8 + obj.phase) * 12;
  const s = 14 * obj.size;
  const colors = ['#FF6B6B','#4D96FF','#FFD93D','#C084FC','#6BCB77'];
  const color = colors[Math.floor(obj.phase * 3) % colors.length];
  // Balloon body (ellipse)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, s * 0.7, s, 0, 0, Math.PI * 2);
  ctx.fill();
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(x - s * 0.2, y - s * 0.3, s * 0.2, s * 0.35, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // Knot
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - 3, y + s);
  ctx.lineTo(x + 3, y + s);
  ctx.lineTo(x, y + s + 5);
  ctx.fill();
  // String
  ctx.strokeStyle = 'rgba(150,150,150,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(x, y + s + 5);
  ctx.quadraticCurveTo(x + Math.sin(t * 1.2 + obj.phase) * 8, y + s + 25, x + Math.sin(t + obj.phase) * 5, y + s + 50);
  ctx.stroke();
}

function drawShootingStar(obj, t, screenY) {
  // Shooting stars streak across the screen periodically
  const period = 8; // seconds between appearances
  const activeTime = 0.6; // how long the streak lasts
  const cycleT = (t + obj.phase * period) % period;
  if (cycleT > activeTime) return; // invisible most of the time
  const progress = cycleT / activeTime;
  const startX = obj.dir > 0 ? -40 : W + 40;
  const endX = obj.dir > 0 ? W + 40 : -40;
  const x = lerp(startX, endX, progress);
  const y = screenY + progress * 80;
  // Trail
  const trailLen = 40;
  ctx.globalAlpha = (1 - progress) * 0.9;
  const grad = ctx.createLinearGradient(x, y, x - (obj.dir > 0 ? trailLen : -trailLen), y - 20);
  grad.addColorStop(0, '#FFFFFF');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - (obj.dir > 0 ? trailLen : -trailLen), y - 20);
  ctx.stroke();
  // Head
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(x, y, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawAurora(obj, t, screenY) {
  // Northern lights — flowing colored curtains
  const alpha = 0.15 + 0.1 * Math.sin(t * 0.3 + obj.phase);
  ctx.globalAlpha = alpha;
  const colors = [
    'rgba(0,255,128,0.6)',
    'rgba(0,200,255,0.4)',
    'rgba(128,0,255,0.3)',
    'rgba(0,255,200,0.5)',
  ];
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.moveTo(0, screenY + i * 30);
    for (let x = 0; x <= W; x += 20) {
      const waveY = Math.sin(x * 0.01 + t * (0.5 + i * 0.2) + obj.phase + i) * 25 + i * 15;
      ctx.lineTo(x, screenY + waveY + i * 30);
    }
    ctx.lineTo(W, screenY + 120 + i * 30);
    ctx.lineTo(0, screenY + 120 + i * 30);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawUFO(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 80)) - 40;
  const y = screenY + Math.sin(t * 0.6 + obj.phase) * 25;
  // Beam (flashing)
  if (Math.sin(t * 2 + obj.phase) > 0) {
    ctx.fillStyle = 'rgba(0,255,100,0.08)';
    ctx.beginPath();
    ctx.moveTo(x - 6, y + 8);
    ctx.lineTo(x + 6, y + 8);
    ctx.lineTo(x + 18, y + 60);
    ctx.lineTo(x - 18, y + 60);
    ctx.fill();
  }
  // Dome
  ctx.fillStyle = '#AACCAA';
  ctx.beginPath();
  ctx.ellipse(x, y - 2, 8, 6, 0, Math.PI, 0);
  ctx.fill();
  // Body (saucer)
  ctx.fillStyle = '#889988';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Lights
  const lightPhase = Math.sin(t * 5 + obj.phase);
  const colors = ['#FF0000','#FFFF00','#00FF00','#00FFFF','#FF00FF'];
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + t * 2;
    const lx = x + Math.cos(a) * 13;
    const ly = y + 3 + Math.sin(a) * 2;
    ctx.fillStyle = i === Math.floor((t * 3 + obj.phase) % 5) ? colors[i] : 'rgba(100,100,100,0.5)';
    ctx.beginPath();
    ctx.arc(lx, ly, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawButterfly(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 40)) - 20;
  const y = screenY + Math.sin(t * 1.5 + obj.phase) * 15 + Math.cos(t * 2.3 + obj.phase) * 8;
  const wingAngle = Math.sin(t * 10 + obj.phase) * 0.7;
  const colors = ['#FF69B4','#FF6347','#FFD700','#87CEEB','#DDA0DD'];
  const color = colors[Math.floor(obj.phase * 3) % colors.length];
  // Left wing
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.ellipse(-3, 0, 6, 4 * Math.abs(Math.cos(wingAngle)), 0, 0, Math.PI * 2);
  ctx.fill();
  // Right wing
  ctx.beginPath();
  ctx.ellipse(3, 0, 6, 4 * Math.abs(Math.cos(wingAngle)), 0, 0, Math.PI * 2);
  ctx.fill();
  // Body
  ctx.fillStyle = '#333';
  ctx.globalAlpha = 1;
  ctx.fillRect(-0.8, -4, 1.6, 8);
  // Antennae
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-0.5, -4); ctx.lineTo(-4, -8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0.5, -4); ctx.lineTo(4, -8); ctx.stroke();
  ctx.restore();
}

function drawSpaceStation(obj, t, screenY) {
  const x = ((obj.x + t * obj.speed * obj.dir) % (W + 100)) - 50;
  const y = screenY + Math.sin(t * 0.15 + obj.phase) * 10;
  const s = 12 * obj.size;
  // Central module
  ctx.fillStyle = '#C0C0C0';
  ctx.fillRect(x - s, y - s * 0.4, s * 2, s * 0.8);
  // Solar panels (left)
  ctx.fillStyle = '#4488CC';
  ctx.fillRect(x - s * 2.5, y - s * 0.6, s * 1.2, s * 1.2);
  ctx.strokeStyle = '#336699';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x - s * 2.5, y - s * 0.6, s * 1.2, s * 1.2);
  // Panel grid
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x - s * 2.5 + i * s * 0.4, y - s * 0.6);
    ctx.lineTo(x - s * 2.5 + i * s * 0.4, y + s * 0.6);
    ctx.stroke();
  }
  // Solar panels (right)
  ctx.fillStyle = '#4488CC';
  ctx.fillRect(x + s * 1.3, y - s * 0.6, s * 1.2, s * 1.2);
  ctx.strokeStyle = '#336699';
  ctx.strokeRect(x + s * 1.3, y - s * 0.6, s * 1.2, s * 1.2);
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + s * 1.3 + i * s * 0.4, y - s * 0.6);
    ctx.lineTo(x + s * 1.3 + i * s * 0.4, y + s * 0.6);
    ctx.stroke();
  }
  // Connecting struts
  ctx.fillStyle = '#999';
  ctx.fillRect(x - s, y - 1, s * 0.8, 2);
  ctx.fillRect(x + s * 0.2, y - 1, s * 0.8, 2);
  // Windows
  ctx.fillStyle = '#FFFF88';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(x - s * 0.5 + i * s * 0.5, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}
// DRAW — Game Elements
// ============================================================
function drawGround() {
  const floors = floorCount();
  if (floors > 10) return;
  const groundScreenY = getGroundScreenY();
  if (groundScreenY > H) return;
  const th = theme();
  if (th.id === 'cyberpunk') {
    ctx.fillStyle = '#0A0025';
    ctx.fillRect(0, groundScreenY, W, H - groundScreenY + 10);
    ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 6;
    ctx.strokeStyle = '#00FFFF'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundScreenY); ctx.lineTo(W, groundScreenY); ctx.stroke();
    ctx.shadowBlur = 0;
  } else if (th.id === 'ascii') {
    ctx.fillStyle = '#001100';
    ctx.fillRect(0, groundScreenY, W, H - groundScreenY + 10);
    ctx.fillStyle = '#00FF41';
    ctx.font = '10px Courier New,monospace';
    ctx.textAlign = 'left';
    for (let x = 0; x < W; x += 7) ctx.fillText('▓', x, groundScreenY + 9);
    ctx.textAlign = 'left';
  } else if (th.id === 'pixel') {
    ctx.fillStyle = '#5B3A1A';
    ctx.fillRect(0, groundScreenY, W, H - groundScreenY + 10);
    ctx.fillStyle = '#00BB00';
    ctx.fillRect(0, groundScreenY, W, 8);
    ctx.fillStyle = '#888888';
    for (let x = 10; x < W; x += 64) ctx.fillRect(x, groundScreenY + 8, 16, 8);
  } else {
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, groundScreenY, W, H - groundScreenY + 10);
    ctx.fillStyle = '#6BCB77';
    ctx.fillRect(0, groundScreenY, W, 5);
  }
}

function getGroundScreenY() {
  // Ground is at world Y = tower[0].y + BS + some offset
  // But simpler: ground is below base block
  const base = tower[0];
  if (!base) return H;
  return (base.y + BS + 20) - camera.y + shake.y;
}

function drawTower() {
  if (tower.length === 0) return;

  const base = tower[0];
  const pivotX = base.x + BS / 2;
  const pivotY = base.y + BS; // bottom of base block

  ctx.save();

  // Apply wobble rotation from base of tower
  if (Math.abs(wobble.angle) > 0.001) {
    ctx.translate(pivotX + shake.x, pivotY - camera.y + shake.y);
    ctx.rotate(wobble.angle);
    ctx.translate(-pivotX, -(pivotY - camera.y));
  } else {
    ctx.translate(shake.x, 0);
  }

  // Draw each block
  for (const block of tower) {
    const bx = block.x;
    const by = block.y - camera.y;
    drawBlockTheme(bx, by, block.color, block.perfect && !block.isBase);
  }

  ctx.restore();
}

function drawCrane() {
  if (state !== STATES.PLAYING) return;

  const { angle, blockX, blockY } = getSwingState();
  const th = theme();
  const isCyber = th.id === 'cyberpunk';

  // Crane arm
  const armScreenY = crane.pivotY - 10 - camera.y + shake.y;
  if (isCyber) { ctx.shadowColor = th.hudColor; ctx.shadowBlur = 6; }
  ctx.fillStyle = th.craneColor;
  ctx.fillRect(0, armScreenY - 5, W, 10);
  ctx.fillRect(W - 20, armScreenY - 30, 12, 35);
  ctx.shadowBlur = 0;

  // Cable with stretch
  const stretch = crane.stretch || 0;
  const cl = (crane.cableLength || 140) + stretch;
  const hookX = crane.pivotX + Math.sin(angle) * cl;
  const hookY = crane.pivotY + Math.cos(angle) * cl;

  if (isCyber) { ctx.shadowColor = th.cableColor; ctx.shadowBlur = 5; }
  ctx.strokeStyle = th.cableColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(crane.pivotX + shake.x, crane.pivotY - camera.y + shake.y);
  ctx.lineTo(hookX + shake.x, hookY - camera.y + shake.y);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Hook
  if (isCyber) { ctx.shadowColor = th.hookColor; ctx.shadowBlur = 8; }
  ctx.fillStyle = th.hookColor;
  ctx.beginPath();
  ctx.arc(hookX + shake.x, hookY - camera.y + shake.y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Block on crane (tilted with cable)
  const color = blockColor(tower.length);
  ctx.globalAlpha = 0.95;
  ctx.save();
  ctx.translate(hookX + shake.x, hookY - camera.y + shake.y);
  ctx.rotate(-angle);
  drawBlockTheme(-BS / 2, 0, color, false);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawFallingBlock() {
  if (!fallingBlock) return;
  const rot = fallingBlock.rotation || 0;

  // Draw in the SAME wobble space as the tower so the player sees
  // accurate alignment between the falling block and the tower top.
  // The overlap calculation in landBlock() uses raw (world) coordinates
  // for both block and tower top — applying the same wobble transform
  // here preserves visual↔physics consistency.
  //
  // Without this, a large wobble angle rotates the tower visually but
  // NOT the falling block, causing a mismatch of up to a full block width.

  const base = tower[0];
  const pivotX = base.x + BS / 2;
  const pivotY = base.y + BS;

  ctx.save();

  // Apply the SAME wobble transform as drawTower()
  if (Math.abs(wobble.angle) > 0.001) {
    ctx.translate(pivotX + shake.x, pivotY - camera.y + shake.y);
    ctx.rotate(wobble.angle);
    ctx.translate(-pivotX, -(pivotY - camera.y));
  } else {
    ctx.translate(shake.x, 0);
  }

  const bx = fallingBlock.x + BS / 2;
  const by = fallingBlock.y + BS / 2 - camera.y;

  // Rotate block around its center
  ctx.translate(bx, by);
  ctx.rotate(rot);
  drawBlockTheme(-BS / 2, -BS / 2, fallingBlock.color, false);
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    ctx.save();
    const dx = d.x + BS/2 + shake.x;
    const dy = d.y + BS/2 - camera.y + shake.y;
    ctx.translate(dx, dy);
    ctx.rotate(d.rot);
    drawBlockTheme(-BS/2, -BS/2, d.color, false);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) p.draw(ctx);
}

function drawFloatTexts() {
  const th = theme();
  for (const ft of floatTexts) {
    const alpha = clamp(ft.life / ft.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${ft.size}px ${th.fontFamily}`;
    ctx.textAlign = 'center';
    if (th.id === 'cyberpunk') { ctx.shadowColor = ft.color; ctx.shadowBlur = 8; }
    ctx.fillText(ft.text, ft.x + shake.x, ft.y - camera.y + shake.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawHUD() {
  const th = theme();
  const isCyber = th.id === 'cyberpunk';
  const isAscii = th.id === 'ascii';

  if (isCyber) { ctx.shadowColor = th.hudColor; ctx.shadowBlur = 8; }

  // Score
  const su = Math.max(14, W * 0.065); // scale unit
  ctx.fillStyle = th.hudColor;
  ctx.font = `bold ${su}px ${th.fontFamily}`;
  ctx.textAlign = 'left';
  ctx.fillText(`${score}`, su * 0.6, su * 1.4);

  // Floors
  ctx.font = `${su * 0.55}px ${th.fontFamily}`;
  ctx.fillStyle = isCyber ? th.hudColor + 'BB' : isAscii ? '#00CC33' : 'rgba(255,255,255,0.7)';
  ctx.fillText(`${floorCount()} floors`, su * 0.6, su * 2.1);
  ctx.shadowBlur = 0;

  // Lives (top center)
  ctx.textAlign = 'center';
  ctx.font = `${su * 0.8}px sans-serif`;
  let livesStr = '';
  for (let i = 0; i < CFG.maxLives; i++) livesStr += i < lives ? '❤️' : '🖤';
  ctx.fillStyle = th.hudColor;
  ctx.fillText(livesStr, W / 2, su * 1.4);

  // Combo
  if (combo > 0) {
    ctx.textAlign = 'right';
    ctx.font = `bold ${su * 0.7 + combo}px ${th.fontFamily}`;
    ctx.fillStyle = th.hudComboColor;
    if (isCyber) { ctx.shadowColor = th.hudComboColor; ctx.shadowBlur = 12; }
    ctx.fillText(`×${combo + 1}`, W - su * 0.6, su * 1.4);
    ctx.shadowBlur = 0;
  }

  // Hint
  if (state === STATES.PLAYING && hintOpacity > 0) {
    ctx.globalAlpha = hintOpacity;
    ctx.textAlign = 'center';
    ctx.fillStyle = isAscii ? '#00FF41' : isCyber ? th.hudColor + 'AA' : 'rgba(255,255,255,0.5)';
    ctx.font = `${su * 0.7}px ${th.fontFamily}`;
    ctx.fillText('TAP TO DROP', W/2, H * 0.5);
    ctx.globalAlpha = 1;
  }

  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function drawMenu() {
  const th = theme();
  const t = Date.now() / 1000;
  const bounce = Math.sin(menuAnim * 3) * 3;
  const titleY = H * 0.22 + bounce;
  const su = Math.max(14, W * 0.065); // scale unit

  // --- Background ---
  if (th.id === 'cyberpunk') {
    ctx.fillStyle = '#050010'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,255,255,0.05)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
  } else if (th.id === 'ascii') {
    drawBackgroundAscii();
  } else if (th.id === 'pixel') {
    ctx.fillStyle = '#5C94FC'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFFFFF';
    [30,160,290,400].forEach((cx,i) => {
      const x = Math.floor(((cx + t*10+i*50)%(W+100))-50);
      const y = 40 + i*30;
      ctx.fillRect(x,y,40,12); ctx.fillRect(x-8,y+4,12,8);
      ctx.fillRect(x+36,y+4,12,8); ctx.fillRect(x+10,y-8,20,8);
    });
    ctx.fillStyle = '#5B3A1A'; ctx.fillRect(0, H*0.82, W, H*0.18);
    ctx.fillStyle = '#00BB00'; ctx.fillRect(0, H*0.82, W, 8);
  } else {
    // Classic
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#4FC3F7'); grad.addColorStop(1, '#E1F5FE');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (let i = 0; i < 5; i++) {
      const cx = ((i*120 + t*8 + i*37) % (W+100)) - 50;
      const cy = 60 + i*40 + Math.sin(t*0.3+i)*10;
      ctx.beginPath(); ctx.arc(cx,cy,20,0,Math.PI*2);
      ctx.arc(cx+18,cy-4,15,0,Math.PI*2); ctx.arc(cx-14,cy+3,12,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#8B7355'; ctx.fillRect(0, H*0.82, W, H*0.18);

  if (th.id === 'cyberpunk') { ctx.shadowColor = th.menuTextColor; ctx.shadowBlur = 22; }
  ctx.fillStyle = th.menuTextColor;
  ctx.font = `bold ${su * 1.6}px ${th.fontFamily}`;
  ctx.fillText('TOWER', W/2, titleY);
  ctx.fillText('STACK', W/2, titleY + su * 1.8);

  addButton('CITY', W/2, H * 0.66, btnW, btnH, () => { state = STATES.CITY_VIEW; cityScrollX = 0; }, 'secondary');

  drawButton(W/2, H * 0.75, btnW, btnH, '⚙  SETTINGS', 'secondary');

function drawGameOver() {
  const th = theme();
  const su = Math.max(14, W * 0.065);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  const cardW = W * 0.78, cardH = su * 17;
  const cardX = W/2 - cardW/2, cardY = H/2 - cardH/2;
  const slideUp = Math.min(1, gameOverTimer * 3);

  ctx.save();
  ctx.translate(0, (1 - slideUp) * 100);

  // Card background
  if (th.id === 'cyberpunk') {
    ctx.fillStyle = '#050018';
    ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 20;
    roundRect(cardX, cardY, cardW, cardH, 8); ctx.fill();
    ctx.strokeStyle = '#00FFFF'; ctx.lineWidth = 2; ctx.shadowBlur = 10;
    roundRect(cardX, cardY, cardW, cardH, 8); ctx.stroke();
    ctx.shadowBlur = 0;
  } else if (th.id === 'ascii') {
    ctx.fillStyle = '#000A00';
    roundRect(cardX, cardY, cardW, cardH, 4); ctx.fill();
    ctx.strokeStyle = '#00FF41'; ctx.lineWidth = 1;
    roundRect(cardX, cardY, cardW, cardH, 4); ctx.stroke();
  } else if (th.id === 'pixel') {
    ctx.fillStyle = '#000088';
    ctx.fillRect(cardX, cardY, cardW, cardH);
    ctx.fillStyle = '#FFFFFF';
    const bw = Math.max(2, su * 0.15);
    ctx.fillRect(cardX, cardY, cardW, bw); ctx.fillRect(cardX, cardY+cardH-bw, cardW, bw);
    ctx.fillRect(cardX, cardY, bw, cardH); ctx.fillRect(cardX+cardW-bw, cardY, bw, cardH);
  } else {
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 20;
    roundRect(cardX, cardY, cardW, cardH, su * 0.6); ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.textAlign = 'center';
  const titleClr = th.id === 'ascii' ? '#00FF41' : th.id === 'cyberpunk' ? '#00FFFF' : th.id === 'pixel' ? '#FFFFFF' : '#1A1A2E';
  const bodyClr  = th.id === 'ascii' ? '#00CC33' : th.id === 'cyberpunk' ? '#00CCCC' : th.id === 'pixel' ? '#AAAAFF' : '#546E7A';

  if (th.id === 'cyberpunk') { ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 10; }
  ctx.fillStyle = titleClr;
  ctx.font = `bold ${su * 1.1}px ${th.fontFamily}`;
  ctx.fillText('GAME OVER', W/2, cardY + su * 1.9);
  ctx.shadowBlur = 0;

  ctx.font = `${su * 0.7}px ${th.fontFamily}`;
  ctx.fillStyle = bodyClr;
  ctx.fillText(`Height: ${floorCount()}`, W/2, cardY + su * 3.7);
  ctx.fillText(`Score: ${score}`, W/2, cardY + su * 5);
  ctx.fillText(`Best combo: ×${bestCombo}`, W/2, cardY + su * 6.3);

  const data = Storage.load();
  if (data.highScore > 0) {
    ctx.fillStyle = th.hudComboColor;
    ctx.font = `bold ${su * 0.65}px ${th.fontFamily}`;
    ctx.fillText(`High Score: ${data.highScore}`, W/2, cardY + su * 7.8);
  }

  // Show API status
  const apiResult = window._lastApiResult;
  const apiError = window._lastApiError;
  const tgStatus = API.isTelegram() ? '✅ TG' : '❌ no TG';
  let submitStatus = '';
  if (apiResult) submitStatus = `✅ Rank #${apiResult.rank}`;
  else if (apiError) submitStatus = `❌ ${apiError}`;
  else if (API.isTelegram()) submitStatus = '⏳ sending...';
  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${su * 0.55}px ${th.fontFamily}`;
  ctx.fillText(`${tgStatus} ${submitStatus}`, W/2, cardY + su * 8.6);

  const btnW = cardW * 0.72, btnH = su * 1.8;
  drawButton(W/2, cardY + su * 9.5, btnW, btnH, '▶  RETRY', 'primary');
  drawButton(W/2, cardY + su * 11.8, btnW, btnH, '🏆  LEADERBOARD', 'secondary');
  drawButton(W/2, cardY + su * 14.1, btnW, btnH, '🏙  MY CITY', 'secondary');

  ctx.restore();
  buttons = [];
  addButton('RETRY', W/2, cardY + su * 9.5, btnW, btnH, () => startGame(), 'primary');
  addButton('LEADERBOARD', W/2, cardY + su * 11.8, btnW, btnH, () => { state = STATES.LEADERBOARD; leaderboardData = null; }, 'secondary');
  addButton('CITY', W/2, cardY + su * 14.1, btnW, btnH, () => { state = STATES.CITY_VIEW; cityScrollX = 0; }, 'secondary');
  ctx.textAlign = 'left';
}

function drawCityView() {
  const th = theme();
  const su = Math.max(14, W * 0.065);

  // Background
  if (th.id === 'cyberpunk') {
    ctx.fillStyle = '#050010'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,255,255,0.05)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  } else if (th.id === 'ascii') {
    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,20,0,0.4)';
    for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  } else if (th.id === 'pixel') {
    ctx.fillStyle = '#000010'; ctx.fillRect(0,0,W,H);
  } else {
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#2C3E50'); grad.addColorStop(1,'#1A252F');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  }

  // Stars
  const t = Date.now() / 1000;
  for (let i = 0; i < 40; i++) {
    const sx=(i*47+Math.sin(i*3.7)*100)%W;
    const sy=(i*31+Math.cos(i*2.3)*80)%(H*0.6);
    const twinkle=0.3+0.7*Math.sin(t*2+i);
    ctx.globalAlpha=twinkle;
    ctx.fillStyle = th.id==='ascii' ? '#00FF41' : th.id==='cyberpunk' ? '#00FFFF' : '#FFF';
    ctx.beginPath(); ctx.arc(sx,sy,1+(i%3),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center';
  if (th.id==='cyberpunk'){ctx.shadowColor=th.hudColor;ctx.shadowBlur=14;}
  ctx.fillStyle=th.menuTextColor;
  ctx.font=`bold ${su * 1.1}px ${th.fontFamily}`;
  ctx.fillText('MY CITY',W/2,su*2);
  ctx.shadowBlur=0;

  const data = Storage.load();
  const towers = data.towers||[];

  if (towers.length===0) {
    ctx.fillStyle = th.id==='ascii'?'#00CC33':th.id==='cyberpunk'?th.hudColor+'AA':'rgba(255,255,255,0.4)';
    ctx.font=`${su * 0.7}px ${th.fontFamily}`;
    ctx.fillText('Build your first tower!',W/2,H*0.4);
    ctx.strokeStyle=th.id==='ascii'?'#00FF41':th.id==='cyberpunk'?'rgba(0,255,255,0.3)':'rgba(255,255,255,0.15)';
    ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.strokeRect(W/2-su,H*0.48,su*2,H*0.2); ctx.setLineDash([]);
  } else {
    const sorted=[...towers].sort((a,b)=>a.height-b.height);
    const maxH=Math.max(...sorted.map(tw=>tw.height));
    const groundY=H*0.82;
    const towerSpacing=su*2.8;
    const startX=su*1.5-cityScrollX;

    ctx.fillStyle=th.id==='cyberpunk'?'#0A0025':th.id==='ascii'?'#001100':th.id==='pixel'?'#5B3A1A':'#2A3A4A';
    ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle=th.id==='cyberpunk'?'#00FFFF':th.id==='ascii'?'#00FF41':th.id==='pixel'?'#00BB00':'#3A4A5A';
    ctx.fillRect(0,groundY,W,3);

    const tWidth=su*1.8;
    sorted.forEach((tw,i)=>{
      const tx=startX+i*towerSpacing;
      if(tx>W+50||tx<-80) return;
      const maxDrawH=H*0.6;
      const tH=Math.max(su*0.8,(tw.height/Math.max(maxH,1))*maxDrawH);
      const color=th.blockColors[i%th.blockColors.length];
      ctx.fillStyle=color;
      ctx.fillRect(tx,groundY-tH,tWidth,tH);
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.fillRect(tx+tWidth-5,groundY-tH,5,tH);
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fillRect(tx,groundY-tH,tWidth,2);
      ctx.fillStyle='rgba(255,255,200,0.25)';
      const winS=Math.max(3,su*0.2);
      const winG=Math.max(4,su*0.5);
      for(let wy=groundY-tH+winG;wy<groundY-winS;wy+=winG)
        for(let wx=tx+winS;wx<tx+tWidth-winS;wx+=winG)
          ctx.fillRect(wx,wy,winS,winS);
      ctx.fillStyle=th.menuTextColor;
      ctx.font=`bold ${su*0.45}px ${th.fontFamily}`;
      ctx.textAlign='center';
      ctx.fillText(`${tw.height}`,tx+tWidth/2,groundY-tH-su*0.25);
    });
  }

  ctx.fillStyle=th.id==='ascii'?'#00CC33':th.id==='cyberpunk'?th.hudColor+'AA':'rgba(255,255,255,0.5)';
  ctx.font=`${su*0.55}px ${th.fontFamily}`;
  ctx.textAlign='center';
  ctx.fillText(`Towers: ${data.totalTowers}  |  Highest: ${data.highestTower}`,W/2,H-su*4);

  buttons=[];
  const btnW2=su*4, btnH2=su*1.7;
  drawButton(W/2-btnW2*0.55,H-su*2.2,btnW2,btnH2,'← BACK','secondary');
  drawButton(W/2+btnW2*0.55,H-su*2.2,btnW2,btnH2,'▶ PLAY','primary');
  addButton('BACK',W/2-btnW2*0.55,H-su*2.2,btnW2,btnH2,()=>{state=STATES.MENU;},'secondary');
  addButton('PLAY',W/2+btnW2*0.55,H-su*2.2,btnW2,btnH2,()=>startGame(),'primary');
  ctx.textAlign='left';
}
