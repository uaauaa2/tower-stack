let _lbFetchTimer = 0;

function drawLeaderboardScreen() {
  const th = theme();
  const su = Math.max(14, W * 0.065);
  const t = Date.now() / 1000;

  // Background
  if (th.id === 'cyberpunk') {
    ctx.fillStyle = '#050010'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,255,255,0.05)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  } else if (th.id === 'ascii') {
    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,W,H);
  } else if (th.id === 'pixel') {
    ctx.fillStyle = '#000010'; ctx.fillRect(0,0,W,H);
  } else {
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a1a2e'); grad.addColorStop(1,'#16213e');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  }

  // Fetch data if needed
  if (!leaderboardData && t - _lbFetchTimer > 2) {
    _lbFetchTimer = t;
    API.getLeaderboard(leaderboardTab, 10).then(data => {
      leaderboardData = data;
    }).catch(() => {
      leaderboardData = { period: leaderboardTab, entries: [] };
    });
  }

  // Title
  ctx.textAlign = 'center';
  if (th.id==='cyberpunk'){ctx.shadowColor=th.hudColor;ctx.shadowBlur=14;}
  ctx.fillStyle = th.menuTextColor;
  ctx.font = `bold ${su*1.3}px ${th.fontFamily}`;
  ctx.fillText('🏆 LEADERBOARD', W/2, su*2.5);
  ctx.shadowBlur=0;

  // Tabs
  const tabW = W * 0.35, tabH = su * 1.6;
  const tabY = su * 3.5;
  // All-time tab
  const allActive = leaderboardTab === 'all';
  ctx.fillStyle = allActive
    ? (th.id==='cyberpunk'?'#00FFFF':th.id==='ascii'?'#00FF41':'#4D96FF')
    : 'rgba(255,255,255,0.1)';
  roundRect(W/2 - tabW - 4, tabY, tabW, tabH, 6); ctx.fill();
  ctx.fillStyle = allActive ? '#FFFFFF' : 'rgba(255,255,255,0.5)';
  ctx.font = `bold ${su*0.6}px ${th.fontFamily}`;
  ctx.fillText('ALL TIME', W/2 - tabW/2 - 4, tabY + tabH*0.65);
  // Weekly tab
  const weekActive = leaderboardTab === 'weekly';
  ctx.fillStyle = weekActive
    ? (th.id==='cyberpunk'?'#00FFFF':th.id==='ascii'?'#00FF41':'#4D96FF')
    : 'rgba(255,255,255,0.1)';
  roundRect(W/2 + 4, tabY, tabW, tabH, 6); ctx.fill();
  ctx.fillStyle = weekActive ? '#FFFFFF' : 'rgba(255,255,255,0.5)';
  ctx.fillText('THIS WEEK', W/2 + tabW/2 + 4, tabY + tabH*0.65);

  buttons = [];
  addButton('TAB_ALL', W/2 - tabW - 4, tabY, tabW, tabH, () => {
    leaderboardTab = 'all'; leaderboardData = null; _lbFetchTimer = 0;
  }, 'secondary');
  addButton('TAB_WEEK', W/2 + 4, tabY, tabW, tabH, () => {
    leaderboardTab = 'weekly'; leaderboardData = null; _lbFetchTimer = 0;
  }, 'secondary');

  // Entries
  const entries = leaderboardData?.entries || [];
  const entryStartY = tabY + tabH + su * 1.2;
  const entryH = su * 2.2;

  if (entries.length === 0 && leaderboardData) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${su*0.7}px ${th.fontFamily}`;
    ctx.fillText('No games played yet!', W/2, entryStartY + su * 3);
    ctx.fillText('Be the first! 🎮', W/2, entryStartY + su * 4.5);
  } else if (!leaderboardData) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${su*0.7}px ${th.fontFamily}`;
    ctx.fillText('Loading...', W/2, entryStartY + su * 3);
  }

  const medals = ['🥇','🥈','🥉'];
  const currentUser = API.getUser()?.id;

  for (let i = 0; i < entries.length && i < 10; i++) {
    const e = entries[i];
    const ey = entryStartY + i * entryH;
    if (ey + entryH > H - su * 4) break;

    const isMe = false; // Can't easily check without usernames matching

    // Row background
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)';
    if (i < 3) ctx.fillStyle = ['rgba(255,215,0,0.08)','rgba(192,192,192,0.06)','rgba(205,127,50,0.06)'][i];
    roundRect(su*0.5, ey, W - su, entryH - 2, 4); ctx.fill();

    // Rank
    ctx.textAlign = 'left';
    ctx.fillStyle = i < 3 ? '#FFD700' : 'rgba(255,255,255,0.6)';
    ctx.font = `bold ${su*0.7}px ${th.fontFamily}`;
    ctx.fillText(i < 3 ? medals[i] : `${e.rank}.`, su*1.2, ey + entryH*0.6);

    // Username
    ctx.fillStyle = th.menuTextColor;
    ctx.font = `bold ${su*0.65}px ${th.fontFamily}`;
    const maxNameW = W * 0.4;
    let name = e.username || 'Anonymous';
    ctx.fillText(name, su*3.5, ey + entryH*0.45);

    // Score
    ctx.textAlign = 'right';
    ctx.fillStyle = th.hudComboColor || '#FFD700';
    ctx.font = `bold ${su*0.7}px ${th.fontFamily}`;
    ctx.fillText(`${e.score.toLocaleString()}`, W - su*3, ey + entryH*0.45);

    // Height
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${su*0.5}px ${th.fontFamily}`;
    ctx.fillText(`${e.height} floors`, W - su*3, ey + entryH*0.8);
  }

  // Back button
  const btnW2 = su * 4, btnH2 = su * 1.8;
  drawButton(W/2, H - su*2, btnW2, btnH2, '← BACK', 'secondary');
  addButton('BACK', W/2, H - su*2, btnW2, btnH2, () => { state = STATES.MENU; leaderboardData = null; }, 'secondary');

  ctx.textAlign = 'left';
}

let _statsFetchTimer = 0;

function drawStatsScreen() {
  const th = theme();
  const su = Math.max(14, W * 0.065);
  const t = Date.now() / 1000;

  // Background
  if (th.id === 'cyberpunk') {
    ctx.fillStyle = '#050010'; ctx.fillRect(0,0,W,H);
  } else if (th.id === 'ascii') {
    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,W,H);
  } else if (th.id === 'pixel') {
    ctx.fillStyle = '#000010'; ctx.fillRect(0,0,W,H);
  } else {
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a1a2e'); grad.addColorStop(1,'#16213e');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  }

  // Fetch if needed
  if (!statsData && API.isTelegram() && t - _statsFetchTimer > 3) {
    _statsFetchTimer = t;
    API.getStats().then(data => { statsData = data; }).catch(() => {
      statsData = { _error: true };
    });
  }

  // Title
  ctx.textAlign = 'center';
  if (th.id==='cyberpunk'){ctx.shadowColor=th.hudColor;ctx.shadowBlur=14;}
  ctx.fillStyle = th.menuTextColor;
  ctx.font = `bold ${su*1.3}px ${th.fontFamily}`;
  ctx.fillText('📊 YOUR STATS', W/2, su*2.5);
  ctx.shadowBlur=0;

  if (!API.isTelegram()) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `${su*0.65}px ${th.fontFamily}`;
    ctx.fillText('Open in Telegram to see online stats', W/2, su*5);
    // Show local stats fallback
    const data = Storage.load();
    const localStats = [
      ['High Score', data.highScore],
      ['Total Towers', data.totalTowers],
      ['Highest Tower', data.highestTower + ' floors'],
    ];
    const startY = su * 7;
    for (let i = 0; i < localStats.length; i++) {
      const sy = startY + i * su * 2.5;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = `${su*0.6}px ${th.fontFamily}`;
      ctx.fillText(localStats[i][0], W/2, sy);
      ctx.fillStyle = th.menuTextColor;
      ctx.font = `bold ${su*1.0}px ${th.fontFamily}`;
      ctx.fillText(String(localStats[i][1]), W/2, sy + su*1.2);
    }
  } else if (!statsData) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${su*0.7}px ${th.fontFamily}`;
    ctx.fillText('Loading...', W/2, su*5);
  } else if (statsData._error) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${su*0.65}px ${th.fontFamily}`;
    ctx.fillText('Could not load stats', W/2, su*5);
    ctx.fillText('Check your connection', W/2, su*6.5);
  } else {
    // Online stats grid
    const s = statsData;
    const stats = [
      ['Rank', `#${s.rank}`],
      ['Games Played', s.total_games],
      ['Best Score', s.best_score.toLocaleString()],
      ['Highest Tower', s.best_height + ' floors'],
      ['Best Combo', '×' + s.best_combo],
      ['Avg Score', s.avg_score.toLocaleString()],
      ['Avg Height', s.avg_height + ' floors'],
      ['Total Perfects', s.total_perfects],
      ['Playtime', s.total_playtime_min + ' min'],
    ];

    const startY = su * 4.5;
    const colH = su * 2;
    for (let i = 0; i < stats.length; i++) {
      const row = i % 2;
      const col = Math.floor(i / 2);
      const cx = row === 0 ? W * 0.28 : W * 0.72;
      const cy = startY + col * colH;

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = `${su*0.45}px ${th.fontFamily}`;
      ctx.fillText(stats[i][0], cx, cy);

      ctx.fillStyle = th.menuTextColor;
      ctx.font = `bold ${su*0.75}px ${th.fontFamily}`;
      ctx.fillText(String(stats[i][1]), cx, cy + su*0.8);
    }

    // Achievements
    if (s.achievements && s.achievements.length > 0) {
      const achY = startY + Math.ceil(stats.length/2) * colH + su;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = `${su*0.45}px ${th.fontFamily}`;
      ctx.fillText(`🏅 ${s.achievements.length} Achievements`, W/2, achY);

      const achLabels = {
        first_game:'🎮', height_10:'🏗️', height_25:'🗼', height_50:'🏙️',
        combo_3:'🔥', combo_5:'⚡', combo_10:'💎', score_1000:'💰',
        score_5000:'🎰', score_10000:'👑', games_10:'🎯', games_50:'🏆', perfect_10:'👁️'
      };
      ctx.font = `${su*0.8}px sans-serif`;
      const achStr = s.achievements.map(k => achLabels[k] || '⭐').join(' ');
      ctx.fillText(achStr, W/2, achY + su);
    }
  }

  // Back button
  buttons = [];
  const btnW2 = su * 4, btnH2 = su * 1.8;
  drawButton(W/2, H - su*2, btnW2, btnH2, '← BACK', 'secondary');
  addButton('BACK', W/2, H - su*2, btnW2, btnH2, () => { state = STATES.MENU; statsData = null; }, 'secondary');

  ctx.textAlign = 'left';
}

function drawButton(cx, cy, w, h, label, style) {
  const th = theme();
  const x = cx - w/2, y = cy - h/2;
  const fSize = Math.max(13, h * 0.36);
  const fOff = h * 0.12;

  if (th.id === 'cyberpunk') {
    const nc = style === 'primary' ? '#00FFFF' : '#FF00FF';
    ctx.fillStyle = 'rgba(0,0,10,0.8)';
    roundRect(x, y, w, h, 6); ctx.fill();
    ctx.shadowColor = nc; ctx.shadowBlur = 10;
    ctx.strokeStyle = nc; ctx.lineWidth = 2;
    roundRect(x, y, w, h, 6); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = nc;
    ctx.font = `bold ${fSize}px ${th.fontFamily}`;
    ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + fOff);
  } else if (th.id === 'ascii') {
    ctx.fillStyle = '#001100';
    roundRect(x, y, w, h, 4); ctx.fill();
    ctx.strokeStyle = '#00FF41'; ctx.lineWidth = 1;
    roundRect(x, y, w, h, 4); ctx.stroke();
    ctx.fillStyle = '#00FF41';
    ctx.font = `bold ${fSize}px ${th.fontFamily}`;
    ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + fOff);
  } else if (th.id === 'pixel') {
    const bc = style === 'primary' ? '#2244FF' : '#AA0000';
    const bw = Math.max(2, h * 0.07);
    ctx.fillStyle = bc; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.fillRect(x, y, w, bw); ctx.fillRect(x, y, bw, h);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(x, y+h-bw, w, bw); ctx.fillRect(x+w-bw, y, bw, h);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `bold ${fSize}px ${th.fontFamily}`;
    ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + fOff);
  } else {
    // Classic
    ctx.fillStyle = style === 'primary' ? '#4D96FF' : '#FF6B6B';
    ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 8;
    roundRect(x, y, w, h, Math.max(8, h * 0.25)); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `bold ${fSize}px ${th.fontFamily}`;
    ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + fOff);
  }
  ctx.textAlign = 'left';
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function addButton(label, cx, cy, w, h, action, style) {
  buttons.push({ label, cx, cy, w, h, action, style });
}

// ============================================================
// MAIN LOOP
// ============================================================
function tick(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 1/30);
  lastTime = timestamp;

  update(dt);

  ctx.clearRect(0, 0, W, H);
  buttons = [];

  switch (state) {
    case STATES.MENU:
      drawMenu();
      break;

    case STATES.PLAYING:
    case STATES.DROPPING:
      drawBackground();
      drawGround();
      drawTower();
      drawDebris();
      drawCrane();
      drawFallingBlock();
      drawParticles();
      drawFloatTexts();
      drawHUD();
      break;

    case STATES.GAME_OVER:
      drawBackground();
      drawGround();
      drawTower();
      drawDebris();
      drawParticles();
      drawFloatTexts();
      drawHUD();
      drawGameOver();
      break;

    case STATES.CITY_VIEW:
      drawCityView();
      break;

    case STATES.LEADERBOARD:
      drawLeaderboardScreen();
      break;

    case STATES.STATS:
      drawStatsScreen();
      break;

    case STATES.SETTINGS:
      // Settings form is HTML overlay, just draw bg
      drawSettingsBg();
      break;
  }

  requestAnimationFrame(tick);
}

lastTime = performance.now();
requestAnimationFrame(tick);

// ============================================================
// SETTINGS SCREEN
// ============================================================
const SETTINGS_DEFS = [
  { key: 'blockSize', label: 'Block Size (px)', type: 'number', min: 20, max: 200, step: 5 },
  { key: 'swingSpeed', label: 'Swing Speed (rad/s)', type: 'number', min: 0.5, max: 10, step: 0.1 },
  { key: 'maxAngleMax', label: 'Max Swing Angle (°)', type: 'number', min: 5, max: 60, step: 1, toRad: true },
  { key: 'maxAngleStart', label: 'Start Swing Angle (°)', type: 'number', min: 0.5, max: 10, step: 0.5, toRad: true },
  { key: 'cableLength', label: 'Cable Length (px)', type: 'number', min: 50, max: 1000, step: 10, isExpr: true },
  { key: 'cableStretchFactor', label: 'Cable Stretch %', type: 'number', min: 0, max: 0.2, step: 0.005 },
  { key: 'cableStiffness', label: 'Cable Spring Stiffness', type: 'number', min: 1, max: 100, step: 1 },
  { key: 'cableStretchDamping', label: 'Cable Spring Damping', type: 'number', min: 1, max: 30, step: 0.5 },
  { key: 'gravity', label: 'Gravity (px/s²)', type: 'number', min: 500, max: 5000, step: 100 },
  { key: 'missOverlapRatio', label: 'Miss Overlap Ratio', type: 'number', min: 0.1, max: 0.5, step: 0.05 },
  { key: 'maxLives', label: 'Lives', type: 'number', min: 1, max: 10, step: 1 },
  { key: 'perfectTolerance', label: 'Perfect Tolerance (px)', type: 'number', min: 1, max: 30, step: 1 },
  { key: 'visibleBlocks', label: 'Visible Blocks', type: 'number', min: 2, max: 10, step: 0.5 },
  { key: 'cameraLerp', label: 'Camera Smooth', type: 'number', min: 1, max: 15, step: 0.5 },
  { key: 'wobbleHeightFactor', label: 'Wobble Height Factor', type: 'number', min: 0.005, max: 0.1, step: 0.005 },
  { key: 'wobbleSpringK', label: 'Wobble Spring K', type: 'number', min: 1, max: 20, step: 0.5 },
  { key: 'wobbleDamping', label: 'Wobble Damping', type: 'number', min: 0.1, max: 5, step: 0.1 },
  { key: 'fallRestoringSpring', label: 'Fall Restoring Spring', type: 'number', min: 1, max: 40, step: 1 },
  { key: 'fallAngularDamping', label: 'Fall Angular Damping', type: 'number', min: 0.5, max: 15, step: 0.5 },
];

function getSettingsOverlay() {
  return document.getElementById('settings-overlay');
}

function initSettingsForm() {
  const overlay = getSettingsOverlay();
  overlay.style.display = 'flex';
  const form = document.getElementById('settings-form');
  form.innerHTML = '';

  // === Theme selector ===
  const themeSection = document.createElement('div');
  themeSection.style.cssText = 'margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee;';
  const themeLabel = document.createElement('div');
  themeLabel.textContent = 'Visual Theme';
  themeLabel.style.cssText = 'font-weight:bold;font-size:14px;color:#333;margin-bottom:8px;font-family:sans-serif;';
  themeSection.appendChild(themeLabel);

  const themeGrid = document.createElement('div');
  themeGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px;';

  const refreshBtns = () => {
    themeGrid.querySelectorAll('button').forEach((b, i) => {
      const tid = Object.keys(THEMES)[i];
      const active = tid === activeTheme;
      b.style.border = `2px solid ${active ? '#4D96FF' : '#ddd'}`;
      b.style.background = active ? '#EEF4FF' : '#fff';
      b.style.fontWeight = active ? 'bold' : 'normal';
    });
  };

  for (const [id, th] of Object.entries(THEMES)) {
    const btn = document.createElement('button');
    btn.textContent = th.name;
    const isActive = id === activeTheme;
    btn.style.cssText = `padding:8px 4px;border:2px solid ${isActive?'#4D96FF':'#ddd'};border-radius:8px;background:${isActive?'#EEF4FF':'#fff'};cursor:pointer;font-size:13px;font-family:sans-serif;font-weight:${isActive?'bold':'normal'};`;
    btn.onclick = () => { activeTheme = id; Storage.saveTheme(id); refreshBtns(); };
    themeGrid.appendChild(btn);
  }
  themeSection.appendChild(themeGrid);
  form.appendChild(themeSection);

  // === Physics / game settings ===
  for (const def of SETTINGS_DEFS) {
    const row = document.createElement('div');
    row.className = 'srow';
    const label = document.createElement('label');
    label.textContent = def.label;
    const input = document.createElement('input');
    input.type = 'number';
    input.min = def.min;
    input.max = def.max;
    input.step = def.step;
    input.dataset.key = def.key;
    // Get current value from CFG
    let val = CFG[def.key];
    // For cableLength, show the numeric value
    if (def.key === 'cableLength') val = crane.cableLength || CFG.blockSize * 4;
    // For angle params, convert radians → degrees for display
    if (def.toRad) val = val * 180 / Math.PI;
    input.value = parseFloat(val.toFixed(2));
    row.appendChild(label);
    row.appendChild(input);
    form.appendChild(row);
  }
}

function applySettings() {
  const form = document.getElementById('settings-form');
  const inputs = form.querySelectorAll('input');
  for (const input of inputs) {
    const key = input.dataset.key;
    let val = parseFloat(input.value);
    if (isNaN(val)) continue;
    const def = SETTINGS_DEFS.find(d => d.key === key);
    if (def && def.toRad) val = val * Math.PI / 180;
    CFG[key] = val;
  }
  BS = CFG.blockSize;
  // Clear sprite cache — sprites must be rebuilt at new BS
  Object.keys(SPRITE_CACHE).forEach(k => delete SPRITE_CACHE[k]);
  closeSettings();
  startGame();
}

function closeSettings() {
  const overlay = getSettingsOverlay();
  overlay.style.display = 'none';
  state = STATES.MENU;
}

function drawSettingsBg() {
  // Dim background
  ctx.fillStyle = '#E1F5FE';
  ctx.fillRect(0, 0, W, H);
}
</script>
