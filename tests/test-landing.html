<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower Stack — Landing Logic Tests</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  .pass { color: #6BCB77; }
  .fail { color: #FF6B6B; font-weight: bold; }
  h1 { color: #4FC3F7; }
  h2 { color: #FFD93D; margin-top: 30px; }
  pre { background: #0d0d1a; padding: 10px; border-radius: 4px; overflow-x: auto; }
  .summary { font-size: 18px; margin-top: 20px; padding: 10px; border-radius: 6px; }
  .summary.pass-all { background: #1b4332; color: #6BCB77; }
  .summary.has-fail { background: #4a1525; color: #FF6B6B; }
</style>
</head>
<body>
<h1>🏗️ Tower Stack — Landing Logic Tests</h1>
<p>Tests for block placement, wobble interaction, swing inertia, and collision detection.</p>
<pre id="output"></pre>
<div id="summary"></div>

<script>
// ============================================================
// Test Harness
// ============================================================
const output = document.getElementById('output');
const summary = document.getElementById('summary');
let totalTests = 0, passed = 0, failed = 0;

function log(msg) { output.textContent += msg + '\n'; }
function pass(name) { totalTests++; passed++; log(`  ✅ PASS: ${name}`); }
function fail(name, detail) { totalTests++; failed++; log(`  ❌ FAIL: ${name}\n       → ${detail}`); }
function assert(condition, name, detail = '') {
  if (condition) pass(name);
  else fail(name, detail || 'Assertion failed');
}
function assertApprox(actual, expected, tolerance, name) {
  const ok = Math.abs(actual - expected) <= tolerance;
  if (ok) pass(name);
  else fail(name, `Expected ${expected} ± ${tolerance}, got ${actual}`);
}

function section(title) { log(`\n${'='.repeat(60)}\n  ${title}\n${'='.repeat(60)}`); }

// ============================================================
// Replicate core game constants and logic for testing
// ============================================================
// These must mirror index.html exactly. If game logic changes,
// update these constants.

const CFG = {
  blockSize: 90,
  swingSpeed: Math.PI,
  cableLength: 360, // 4 * blockSize
  cableStretchPct: 0.04,
  cableStiffness: 6,
  cableStretchDamping: 12,
  gravity: 2000,
  missOverlapRatio: 0.3,
  maxLives: 3,
  perfectTolerance: 3,
  wobbleHeightFactor: 0.02,
  wobbleSpringK: 5,
  wobbleDamping: 1.5,
  baseScore: 100,
  perfectBonus: 50,
  milestoneBonus: 500,
  milestoneEvery: 10,
  cameraLerp: 5,
  visibleBlocks: 3.5,
  swingAngleMax: 20 * Math.PI / 180, // degrees to radians
};

const BS = CFG.blockSize;
const W = 400; // test canvas width

// ---- Helper functions (mirroring game code) ----

function currentMaxAngle(towerLen) {
  // Smoothstep interpolation: starts small, reaches swingAngleMax at high floors
  const maxAngle = CFG.swingAngleMax;
  const t = Math.min(1, towerLen / 80); // normalize over 80 floors
  // smoothstep
  const s = t * t * (3 - 2 * t);
  return maxAngle * (0.05 + 0.95 * s); // starts at 5% of max
}

function getSwingState(pivotX, pivotY, cableLen, time, towerLen, stretch = 0) {
  const speed = CFG.swingSpeed;
  const maxA = currentMaxAngle(towerLen);
  const angle = maxA * Math.sin(time * speed);
  const angularVel = maxA * speed * Math.cos(time * speed);

  const cl = cableLen + stretch;
  const hookX = pivotX + Math.sin(angle) * cl;
  const hookY = pivotY + Math.cos(angle) * cl;

  // Block position: hook is at top-center of block
  const blockX = hookX - BS / 2;
  const blockY = hookY;

  // Horizontal velocity of the block
  const vx = angularVel * cl;

  return { angle, blockX, blockY, vx, speed, maxA, cl, hookX, hookY, angularVel };
}

// Simulate block falling with inertia
function simulateDrop(startX, startY, vx, dt = 1/60, maxFrames = 300) {
  let x = startX, y = startY, vy = 0;
  for (let i = 0; i < maxFrames; i++) {
    vy += CFG.gravity * dt;
    x += vx * dt;
    y += vy * dt;
    // Clamp to screen bounds
    x = Math.max(-BS, Math.min(W, x));
  }
  return { x, y, vx, vy };
}

// Find where block lands on tower top
function findLandingPosition(startX, startY, vx, towerTopY, dt = 1/60) {
  let x = startX, y = startY, vy = 0;
  let frames = 0;
  while (y + BS < towerTopY && frames < 600) {
    vy += CFG.gravity * dt;
    x += vx * dt;
    y += vy * dt;
    x = Math.max(-BS, Math.min(W, x));
    frames++;
  }
  return { x, y, vx, vy, frames };
}

// Calculate overlap between two blocks
function calcOverlap(blockX, topX) {
  const oL = Math.max(blockX, topX);
  const oR = Math.min(blockX + BS, topX + BS);
  return Math.max(0, oR - oL);
}

// ============================================================
// TEST SUITE 1: Basic Landing Position
// ============================================================
section('TEST SUITE 1: Basic Landing Position');

(function() {
  // T1.1: Block dropped from center with no horizontal velocity
  // should land exactly on center of tower top
  const topX = W / 2 - BS / 2; // centered tower top
  const startY = topX - 400; // well above
  const result = findLandingPosition(W / 2 - BS / 2, startY, 0, topX);
  const overlap = calcOverlap(result.x, topX);
  assert(overlap === BS, 'T1.1: Center drop, no inertia → full overlap',
    `overlap=${overlap}, expected=${BS}`);

  // T1.2: Block with small rightward velocity
  const vx2 = 50; // 50 px/s rightward
  const result2 = findLandingPosition(W / 2 - BS / 2, startY, vx2, topX);
  const overlap2 = calcOverlap(result2.x, topX);
  assert(overlap2 > 0, 'T1.2: Small rightward velocity → still overlaps',
    `overlap=${overlap2}, blockX=${result2.x.toFixed(1)}`);
  assert(result2.x > W / 2 - BS / 2, 'T1.2b: Block shifted right from center',
    `blockX=${result2.x.toFixed(1)}, expected > ${W/2 - BS/2}`);

  // T1.3: Block with large horizontal velocity → may miss
  const vx3 = 800; // 800 px/s
  const result3 = findLandingPosition(W / 2 - BS / 2, startY - 300, vx3, topX);
  const overlap3 = calcOverlap(result3.x, topX);
  log(`  ℹ️  T1.3: Large vx (800px/s) → overlap=${overlap3.toFixed(1)}, blockX=${result3.x.toFixed(1)}`);

  // T1.4: Perfect landing detection (within ±3px of center)
  const centerOffset = Math.abs(result.x + BS/2 - (topX + BS/2));
  assert(centerOffset <= CFG.perfectTolerance, 'T1.4: Center drop → perfect placement',
    `offset=${centerOffset}, tolerance=${CFG.perfectTolerance}`);
})();

// ============================================================
// TEST SUITE 2: Swing Velocity & Horizontal Inertia
// ============================================================
section('TEST SUITE 2: Swing Velocity & Horizontal Inertia');

(function() {
  // T2.1: At maximum swing angle (sin=1), angular velocity should be near 0
  // (cos(π/2) ≈ 0 at the extreme)
  const towerLen = 20;
  const pivotX = W / 2;
  const pivotY = 100;
  const cableLen = CFG.cableLength;
  // Time when sin(time * speed) = 1 → time = π/(2*speed)
  const timeAtExtreme = Math.PI / (2 * CFG.swingSpeed);
  const state1 = getSwingState(pivotX, pivotY, cableLen, timeAtExtreme, towerLen);

  assertApprox(state1.vx, 0, 15, 'T2.1: At swing extreme, horizontal velocity ≈ 0',
    `vx=${state1.vx.toFixed(2)}`);

  // T2.2: At center (sin=0), angular velocity is maximum
  // time = 0 → sin(0) = 0, cos(0) = 1
  const state2 = getSwingState(pivotX, pivotY, cableLen, 0, towerLen);
  const expectedMaxVel = currentMaxAngle(towerLen) * CFG.swingSpeed * cableLen;
  assertApprox(Math.abs(state2.vx), expectedMaxVel, 1,
    'T2.2: At center, |vx| = maxAngle * speed * cableLength',
    `vx=${state2.vx.toFixed(2)}, expected=${expectedMaxVel.toFixed(2)}`);

  // T2.3: Positive angle → block is right of center, moving right initially
  // At time just after 0, angle is small positive (swinging right)
  const state3 = getSwingState(pivotX, pivotY, cableLen, 0.01, towerLen);
  // angularVel = maxA * speed * cos(0.01 * speed) → positive
  // vx = angularVel * cl → positive → block moves right
  assert(state3.vx > 0, 'T2.3: Just after center, vx > 0 (moving right)',
    `vx=${state3.vx.toFixed(2)}`);

  // T2.4: Cable stretch affects velocity
  const maxStretch = CFG.cableStretchPct * cableLen;
  const state4a = getSwingState(pivotX, pivotY, cableLen, 0.3, towerLen, 0);
  const state4b = getSwingState(pivotX, pivotY, cableLen, 0.3, towerLen, maxStretch);
  // With stretch, cl is longer, so vx should be larger
  const vxNoStretch = Math.abs(state4a.vx);
  const vxWithStretch = Math.abs(state4b.vx);
  assert(vxWithStretch > vxNoStretch, 'T2.4: Cable stretch increases horizontal velocity',
    `noStretch vx=${vxNoStretch.toFixed(2)}, withStretch vx=${vxWithStretch.toFixed(2)}`);
  log(`  ℹ️  Stretch effect on vx: ${(vxWithStretch - vxNoStretch).toFixed(2)} px/s increase`);

  // T2.5: Drop at center vs extreme — center has much more horizontal drift
  const topY = 600;
  const dropCenter = findLandingPosition(state2.blockX, state2.blockY, state2.vx, topY);
  const dropExtreme = findLandingPosition(state1.blockX, state1.blockY, state1.vx, topY);
  const driftCenter = Math.abs(dropCenter.x - (W/2 - BS/2));
  const driftExtreme = Math.abs(dropExtreme.x - (W/2 - BS/2));
  assert(driftCenter > driftExtreme, 'T2.5: Drop at center → more drift than at extreme',
    `center_drift=${driftCenter.toFixed(1)}, extreme_drift=${driftExtreme.toFixed(1)}`);
})();

// ============================================================
// TEST SUITE 3: Wobble vs Landing — The Critical Bug Test
// ============================================================
section('TEST SUITE 3: Wobble vs Landing Position (Critical)');

(function() {
  // The tower is drawn with wobble rotation (ctx.rotate) from the base.
  // But landing position is calculated in world coordinates WITHOUT wobble.
  // This means: if the tower is wobbled, the VISUAL position of tower top
  // is different from its ACTUAL stored position.

  // T3.1: Demonstrate the wobble-visual offset
  const towerLen = 30;
  const topX = W / 2 - BS / 2;
  const baseX = W / 2 - BS / 2;
  const wobbleAngle = 0.03; // ~1.7 degrees

  // Visual position of tower top after wobble rotation around base center
  const baseCenterX = baseX + BS / 2;
  const baseCenterY = 0; // base is at y=0 conceptually
  const towerHeight = towerLen * BS; // 30 * 90 = 2700px
  const topWorldY = baseCenterY - towerHeight; // world Y of tower top

  // Rotation of (0, -towerHeight) around (baseCenterX, 0) by wobbleAngle
  // After rotation:
  // dx = 0 * cos(a) - (-towerHeight) * sin(a) = towerHeight * sin(a)
  // dy = 0 * sin(a) + (-towerHeight) * cos(a) = -towerHeight * cos(a)
  const visualTopX = baseCenterX + towerHeight * Math.sin(wobbleAngle);
  const visualTopY = baseCenterY - towerHeight * Math.cos(wobbleAngle);

  const visualOffsetX = visualTopX - baseCenterX;
  log(`  ℹ️  T3.1: Wobble angle ${(wobbleAngle * 180 / Math.PI).toFixed(2)}° at ${towerLen} floors`);
  log(`       World top X: ${topX.toFixed(1)}, Visual top X: ${visualTopX.toFixed(1)}`);
  log(`       Visual offset: ${visualOffsetX.toFixed(1)} px`);

  // At 30 floors with 0.03 rad wobble: offset ≈ 2700 * sin(0.03) ≈ 81 px!
  // This is ALMOST A FULL BLOCK WIDTH (90px)!
  assert(visualOffsetX > 10, 'T3.1: Wobble creates significant visual offset (>10px)',
    `offset=${visualOffsetX.toFixed(1)}px`);

  // T3.2: The landing collision uses world coordinates, not visual
  // So when the tower is visually offset by wobble, a block that LOOKS like
  // it's landing perfectly might actually miss (or vice versa)

  // Simulate: tower wobbled right, block drops from above aligned to VISUAL top
  const alignedToVisual = visualTopX - BS / 2;
  const alignedToWorld = topX;
  const worldOverlap = calcOverlap(alignedToVisual, topX);
  const expectedOverlap = calcOverlap(alignedToWorld, topX);

  log(`  ℹ️  T3.2: Block aligned to visual top: overlap with world top = ${worldOverlap.toFixed(1)}`);
  log(`       Block aligned to world top: overlap = ${expectedOverlap.toFixed(1)}`);

  // If wobble offset is significant, aligning to visual gives different overlap
  if (visualOffsetX > BS * CFG.missOverlapRatio) {
    assert(worldOverlap < BS, 'T3.2: Wobble misalignment causes overlap mismatch',
      `visual_aligned_overlap=${worldOverlap.toFixed(1)} vs world_aligned=${expectedOverlap.toFixed(1)}`);
    log(`  ⚠️  BUG CONFIRMED: Player sees block aligned to tower, but game calculates different overlap`);
    log(`       This gets worse at higher towers with more wobble`);
  }

  // T3.3: Wobble offset vs miss threshold
  // At what wobble angle does the visual offset equal the miss threshold?
  const missThreshold = BS * (1 - CFG.missOverlapRatio); // 63px offset needed for miss
  const criticalAngle = Math.asin(missThreshold / towerHeight);
  log(`  ℹ️  T3.3: At ${towerLen} floors, miss from wobble at angle ${(criticalAngle * 180 / Math.PI).toFixed(2)}°`);
  log(`       Current wobble angle: ${(wobbleAngle * 180 / Math.PI).toFixed(2)}°`);
  log(`       Miss threshold offset: ${missThreshold.toFixed(1)}px`);

  // T3.4: The actual bug — block placed at fb.x (world coords)
  // but player saw it land at a wobble-adjusted visual position
  // This means placed.x might be off-center when it LOOKED centered
  const fakePlacedX = topX + 30; // 30px offset (looks centered due to wobble)
  const placedOffset = Math.abs(fakePlacedX + BS/2 - (topX + BS/2));
  const isPerfectByWorld = placedOffset <= CFG.perfectTolerance;
  log(`  ℹ️  T3.4: Block placed 30px off-center in world coords`);
  log(`       Perfect by world? ${isPerfectByWorld} (offset=${placedOffset}px, tolerance=${CFG.perfectTolerance}px)`);
  assert(!isPerfectByWorld, 'T3.4: Off-center placement NOT marked as perfect',
    'Correct behavior — but player may have seen it as centered');
})();

// ============================================================
// TEST SUITE 4: Drop Physics Accuracy
// ============================================================
section('TEST SUITE 4: Drop Physics — vx Calculation');

(function() {
  // T4.1: Verify vx = angularVel * cl formula
  const towerLen = 10;
  const pivotX = W / 2;
  const pivotY = 100;
  const cableLen = CFG.cableLength;
  const time = 0.5; // arbitrary time

  const s = getSwingState(pivotX, pivotY, cableLen, time, towerLen);
  const maxA = currentMaxAngle(towerLen);
  const expectedAngularVel = maxA * CFG.swingSpeed * Math.cos(time * CFG.swingSpeed);
  const expectedVx = expectedAngularVel * cableLen;

  assertApprox(s.vx, expectedVx, 0.1, 'T4.1: vx = angularVel * cableLength',
    `vx=${s.vx.toFixed(4)}, expected=${expectedVx.toFixed(4)}`);

  // T4.2: Block position should follow pendulum equations
  const expectedBlockX = pivotX + Math.sin(s.angle) * cableLen - BS / 2;
  assertApprox(s.blockX, expectedBlockX, 0.1, 'T4.2: blockX = pivotX + sin(angle)*cl - BS/2',
    `blockX=${s.blockX.toFixed(4)}, expected=${expectedBlockX.toFixed(4)}`);

  // T4.3: Horizontal drift during fall — verify with physics
  // A block dropped from height h with initial vx drifts by vx * sqrt(2h/g)
  const dropHeight = 300; // 300px above tower top
  const dropVx = 100; // 100 px/s horizontal
  const topY = 500;
  const startY = topY - BS - dropHeight;

  const result = findLandingPosition(W/2 - BS/2, startY, dropVx, topY);
  // Time to fall: h = 0.5 * g * t² → t = sqrt(2h/g)
  const fallTime = Math.sqrt(2 * dropHeight / CFG.gravity);
  const expectedDrift = dropVx * fallTime;
  const actualDrift = result.x - (W/2 - BS/2);

  assertApprox(actualDrift, expectedDrift, 5,
    'T4.3: Horizontal drift = vx * fall_time',
    `drift=${actualDrift.toFixed(1)}, expected=${expectedDrift.toFixed(1)}`);
})();

// ============================================================
// TEST SUITE 5: Overlap & Miss Detection
// ============================================================
section('TEST SUITE 5: Overlap & Miss Detection');

(function() {
  const topX = W / 2 - BS / 2; // centered tower top at x=155

  // T5.1: Perfect center alignment → full overlap
  assert(calcOverlap(topX, topX) === BS,
    'T5.1: Identical position → full overlap');

  // T5.2: Offset by 1px → still full overlap within tolerance
  assert(calcOverlap(topX + 1, topX) === BS - 1,
    'T5.2: 1px offset → overlap = BS - 1');

  // T5.3: Offset by 50% → 50% overlap (NOT a miss, > 30%)
  const overlap50 = calcOverlap(topX + BS * 0.5, topX);
  assertApprox(overlap50, BS * 0.5, 0.1,
    'T5.3: 50% offset → 50% overlap',
    `overlap=${overlap50}`);

  // T5.4: Offset by 80% → 20% overlap (IS a miss, < 30%)
  const overlap80 = calcOverlap(topX + BS * 0.8, topX);
  const ratio80 = overlap80 / BS;
  assert(ratio80 < CFG.missOverlapRatio,
    'T5.4: 80% offset → miss (< 30% overlap)',
    `ratio=${ratio80.toFixed(2)}`);

  // T5.5: Just at miss boundary (70% offset → 30% overlap)
  const overlap70 = calcOverlap(topX + BS * 0.7, topX);
  const ratio70 = overlap70 / BS;
  assertApprox(ratio70, 0.3, 0.01,
    'T5.5: 70% offset → exactly 30% overlap (boundary)',
    `ratio=${ratio70.toFixed(3)}`);

  // T5.6: Complete miss (no overlap)
  assert(calcOverlap(topX + BS + 1, topX) === 0,
    'T5.6: Block completely past tower → 0 overlap');

  // T5.7: Overlap from left side
  const overlapLeft = calcOverlap(topX - BS * 0.5, topX);
  assertApprox(overlapLeft, BS * 0.5, 0.1,
    'T5.7: 50% offset from left → 50% overlap');
})();

// ============================================================
// TEST SUITE 6: Perfect Placement Snap Logic
// ============================================================
section('TEST SUITE 6: Perfect Placement & Snap');

(function() {
  const topX = W / 2 - BS / 2;
  const tolerance = CFG.perfectTolerance;

  // T6.1: Within tolerance → should snap to tower top position
  const offset1 = tolerance; // exactly at boundary
  const centerOffset1 = Math.abs((topX + offset1 + BS/2) - (topX + BS/2));
  assert(centerOffset1 <= tolerance, 'T6.1: Offset at tolerance boundary → perfect',
    `offset=${centerOffset1}, tolerance=${tolerance}`);

  // T6.2: Just outside tolerance → NOT perfect
  const offset2 = tolerance + 1;
  const centerOffset2 = Math.abs((topX + offset2 + BS/2) - (topX + BS/2));
  assert(centerOffset2 > tolerance, 'T6.2: Offset +1 beyond tolerance → NOT perfect',
    `offset=${centerOffset2}, tolerance=${tolerance}`);

  // T6.3: When perfect, placed.x should be snapped to top.x
  // (this is what the game does: placed.x = top.x)
  const snappedX = topX; // snap
  const notSnappedX = topX + offset1; // no snap
  const snappedOffset = Math.abs((snappedX + BS/2) - (topX + BS/2));
  assert(snappedOffset === 0, 'T6.3: Snapped position has 0 offset',
    `offset=${snappedOffset}`);

  // T6.4: Verify that non-perfect placement keeps actual landing position
  // (the game does NOT snap non-perfect placements)
  // placed.x = fb.x for non-perfect
  const nonPerfectX = topX + 15; // 15px offset
  assert(nonPerfectX !== topX, 'T6.4: Non-perfect placement keeps actual x position');
})();

// ============================================================
// TEST SUITE 7: Wobble Angle Calculation
// ============================================================
section('TEST SUITE 7: Wobble Amplitude from Cumulative Offset');

(function() {
  // T7.1: Perfect-only tower → 0 wobble
  const towerPerfect = Array(10).fill({ offset: 0 });
  const avgOffset = towerPerfect.reduce((s, b) => s + b.offset, 0) / towerPerfect.length;
  const heightScale = 1 + towerPerfect.length * CFG.wobbleHeightFactor;
  const targetAngle = (avgOffset / BS) * heightScale * 0.3;
  assert(targetAngle === 0, 'T7.1: All-perfect tower → 0 wobble target angle',
    `targetAngle=${targetAngle}`);

  // T7.2: 30px avg offset at 20 floors
  const tower2 = Array(20).fill({ offset: 30 });
  const avg2 = 30;
  const hScale2 = 1 + 20 * CFG.wobbleHeightFactor;
  const tAngle2 = (avg2 / BS) * hScale2 * 0.3;
  log(`  ℹ️  T7.2: 20 floors, 30px avg offset → wobble angle ${(tAngle2 * 180 / Math.PI).toFixed(3)}°`);

  // T7.3: Same offset at 50 floors → more wobble
  const hScale3 = 1 + 50 * CFG.wobbleHeightFactor;
  const tAngle3 = (avg2 / BS) * hScale3 * 0.3;
  assert(tAngle3 > tAngle2, 'T7.3: Same offset, taller tower → more wobble',
    `20f=${(tAngle2*180/Math.PI).toFixed(3)}°, 50f=${(tAngle3*180/Math.PI).toFixed(3)}°`);

  // T7.4: Wobble suppressed when base visible (first few blocks)
  // The game checks if base block is still on screen
  // This means early blocks don't wobble visually
  log(`  ℹ️  T7.4: Wobble suppression for base block visibility — tested visually`);
  pass('T7.4: Wobble suppression exists (code review)');
})();

// ============================================================
// TEST SUITE 8: Edge Cases
// ============================================================
section('TEST SUITE 8: Edge Cases');

(function() {
  const topX = W / 2 - BS / 2;

  // T8.1: Block lands exactly at tower edge (0px overlap)
  const edgeOverlap = calcOverlap(topX + BS, topX);
  assert(edgeOverlap === 0, 'T8.1: Block at exact edge → 0 overlap (miss)',
    `overlap=${edgeOverlap}`);

  // T8.2: Block overlaps by 1px — technically not a miss (>30%? no, 1/90 = 1.1%)
  const onePxOverlap = calcOverlap(topX + BS - 1, topX);
  assert(onePxOverlap === 1, 'T8.2: 1px overlap',
    `overlap=${onePxOverlap}`);
  assert(onePxOverlap / BS < CFG.missOverlapRatio, 'T8.2b: 1px overlap is a miss (< 30%)',
    `ratio=${(onePxOverlap/BS).toFixed(3)}`);

  // T8.3: Negative vx (swinging left)
  const vx = -200;
  const result = findLandingPosition(W/2 - BS/2, 100, vx, 500);
  assert(result.x < W/2 - BS/2, 'T8.3: Negative vx → block drifts left',
    `blockX=${result.x.toFixed(1)}`);

  // T8.4: Very high tower (100 floors) — wobble could cause massive visual offset
  const floors = 100;
  const towerH = floors * BS;
  const angle = 0.05; // moderate wobble
  const offset100 = towerH * Math.sin(angle);
  log(`  ℹ️  T8.4: At ${floors} floors, wobble ${(angle*180/Math.PI).toFixed(1)}° → visual offset = ${offset100.toFixed(1)}px`);
  log(`       That's ${(offset100/BS).toFixed(1)} block widths!`);
  assert(offset100 > BS, 'T8.4: At 100 floors, moderate wobble offsets > 1 block width',
    `offset=${offset100.toFixed(1)}px`);

  // T8.5: Delta time cap prevents physics explosion
  const dt = 1/30; // max dt cap in game
  const bigVy = CFG.gravity * dt;
  log(`  ℹ️  T8.5: Max single-frame velocity at dt cap: ${bigVy.toFixed(1)} px/s`);
  assert(bigVy < 200, 'T8.5: Single-frame velocity is reasonable (< 200px)',
    `vy=${bigVy.toFixed(1)}`);
})();

// ============================================================
// Summary
// ============================================================
log(`\n${'='.repeat(60)}`);
log(`  RESULTS: ${passed}/${totalTests} passed, ${failed} failed`);
log(`${'='.repeat(60)}`);

if (failed === 0) {
  summary.className = 'summary pass-all';
  summary.textContent = `✅ All ${totalTests} tests passed!`;
} else {
  summary.className = 'summary has-fail';
  summary.textContent = `❌ ${failed} of ${totalTests} tests failed`;
}

// Log the critical finding
