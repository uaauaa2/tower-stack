services:
  - type: web
    name: tower-stack-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
